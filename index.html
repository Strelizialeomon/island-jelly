const pierDebris = [];
function destroyPier() {
  if (!pier.visible) return;
  const pieces = [];
  pier.traverse((o) => { if (o.isMesh) pieces.push(o); });
  for (const src of pieces) {
    const mesh = src.clone();
    src.getWorldPosition(mesh.position);
    src.getWorldQuaternion(mesh.quaternion);
    src.getWorldScale(mesh.scale);
    // 先炸散一点，第一帧就能看出桥断了
    mesh.position.x += (Math.random() - 0.5) * 0.9;
    mesh.position.y += Math.random() * 0.55;
    mesh.position.z += (Math.random() - 0.5) * 0.9;
    mesh.rotateZ((Math.random() - 0.5) * 0.9);
    mesh.rotateX((Math.random() - 0.5) * 0.5);
    mesh.castShadow = true;
    scene.add(mesh);
    const dx = mesh.position.x - ISLAND_C.x;
    const dz = mesh.position.z - ISLAND_C.z;
    const len = Math.hypot(dx, dz) || 1;
    const speed = 0.35 + Math.random() * 0.85;
    pierDebris.push({
      mesh,
      vel: new THREE.Vector3((dx / len) * speed, 0.25 + Math.random() * 0.55, (dz / len) * speed),
      spin: new THREE.Vector3(
        (Math.random() - 0.5) * 3.2,
        (Math.random() - 0.5) * 3.2,
        (Math.random() - 0.5) * 3.2
      ),
      life: 6.5,
      splashed: false,
    });
  }
  pier.visible = false;
  if (pier.userData.light) pier.userData.light.visible = false;
}
function updatePierDebris(dt) {
  for (let i = pierDebris.length - 1; i >= 0; i--) {
    const d = pierDebris[i];
    d.vel.y -= 8.5 * dt;
    d.mesh.position.addScaledVector(d.vel, dt);
    d.mesh.rotation.x += d.spin.x * dt;
    d.mesh.rotation.y += d.spin.y * dt;
    d.mesh.rotation.z += d.spin.z * dt;
    if (!d.splashed && d.mesh.position.y < waterLevel) {
      d.splashed = true;
      addDrop(d.mesh.position.x, d.mesh.position.z, 0.07, 0.55);
      d.vel.multiplyScalar(0.22);
    }
    d.life -= dt;
    if (d.life <= 0 || d.mesh.position.y < -3.6) {
      scene.remove(d.mesh);
      pierDebris.splice(i, 1);
    }
  }
}
function restorePier() {
  for (const d of pierDebris) scene.remove(d.mesh);
  pierDebris.length = 0;
  pier.visible = true;
  if (pier.userData.light) pier.userData.light.visible = true;
}

/* ------------------------------------------------------------------ */
/* 岛蟹：藏在山体下面的完整螃蟹，站起时把山一起顶起来                     */
/* ------------------------------------------------------------------ */
function buildGiantCrab() {
  const g = new THREE.Group();
  const inner = new THREE.Group();
  g.add(inner);
  // 身体比山体中心靠前一点，眼柄/螯/前腿露在山体前缘外
  g.position.set(MOUNTAIN_C.x, CRAB_HIDDEN_Y, MOUNTAIN_C.z + CRAB_FORWARD);
  g.rotation.y = 0.16;
  g.visible = false;

  const shellMat = jellyMat(0xd4533a, { opacity: 0.97, iridescence: 0.12 });
  const shellLight = jellyMat(0xe86f50, { opacity: 0.95, iridescence: 0.18 });
  const darkMat = jellyMat(0x8d2d1f, { opacity: 0.97 });
  const underMat = jellyMat(0xb95842, { opacity: 0.95 });
  const eyeWhiteMat = new THREE.MeshPhysicalMaterial({
    color: 0xfff0d6, roughness: 0.14, clearcoat: 1,
  });
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0x171110, roughness: 0.35 });
  const shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

  // 宽而扁的甲壳
  const carapace = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 28), shellMat);
  carapace.scale.set(3.0, 1.0, 2.45);
  carapace.position.y = 0.6;
  carapace.castShadow = true;
  carapace.receiveShadow = true;
  inner.add(carapace);

  const belly = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 18), underMat);
  belly.scale.set(2.65, 0.34, 2.15);
  belly.position.y = 0.05;
  inner.add(belly);

  // 前缘的齿，读起来像蟹壳而不是球
  for (let i = 0; i < 5; i++) {
    const a = -0.85 + i * 0.425;
    const tooth = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.30, 6), shellLight);
    tooth.rotation.x = Math.PI / 2;
    tooth.position.set(Math.sin(a) * 2.22, 0.62, Math.cos(a) * 2.31);
    tooth.castShadow = true;
    inner.add(tooth);
  }

  // 壳缘
  const rim = new THREE.Mesh(new THREE.TorusGeometry(1, 0.04, 8, 72), darkMat);
  rim.rotation.x = Math.PI / 2;
  rim.scale.set(2.96, 2.4, 1);
  rim.position.y = 0.12;
  inner.add(rim);

  // 腹部折在下面
  const abdomen = new THREE.Mesh(new THREE.SphereGeometry(1, 24, 14), darkMat);
  abdomen.scale.set(1.05, 0.22, 0.8);
  abdomen.position.set(0, -0.05, -1.85);
  inner.add(abdomen);

  // 8 条步足
  const legs = [];
  const legDefs = [
    { z: 1.55, spread: 0.24 },
    { z: 0.55, spread: 0.08 },
    { z: -0.55, spread: -0.08 },
    { z: -1.55, spread: -0.24 },
  ];
  for (const side of [-1, 1]) {
    legDefs.forEach((def, li) => {
      const hip = new THREE.Group();
      hip.position.set(side * 2.42, 0.42, def.z);
      hip.rotation.y = side > 0 ? -def.spread : Math.PI + def.spread;
      hip.add(new THREE.Mesh(new THREE.SphereGeometry(0.19, 14, 10), darkMat));

      const seg1 = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.85, 5, 10), shellMat);
      seg1.rotation.z = Math.PI / 2;
      seg1.position.x = 0.56;
      seg1.castShadow = true;
      hip.add(seg1);

      const knee = new THREE.Group();
      knee.position.x = 1.12;
      knee.add(new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), darkMat));
      const seg2 = new THREE.Mesh(new THREE.CapsuleGeometry(0.105, 0.62, 5, 10), shellMat);
      seg2.rotation.z = Math.PI / 2;
      seg2.position.x = 0.44;
      seg2.castShadow = true;
      knee.add(seg2);
      hip.add(knee);

      const ankle = new THREE.Group();
      ankle.position.x = 0.88;
      ankle.add(new THREE.Mesh(new THREE.SphereGeometry(0.125, 12, 8), darkMat));
      const seg3 = new THREE.Mesh(new THREE.CapsuleGeometry(0.085, 0.48, 5, 8), shellMat);
      seg3.rotation.z = Math.PI / 2;
      seg3.position.x = 0.33;
      seg3.castShadow = true;
      ankle.add(seg3);
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.28, 8), darkMat);
      tip.rotation.z = -Math.PI / 2;
      tip.position.x = 0.72;
      tip.castShadow = true;
      ankle.add(tip);
      knee.add(ankle);

      inner.add(hip);
      legs.push({ hip, knee, ankle, side, li });
    });
  }

  // 两只螯
  const claws = [];
  for (const side of [-1, 1]) {
    const root = new THREE.Group();
    root.position.set(side * 1.35, 0.58, 1.95);
    root.rotation.y = -side * 0.16;

    const upper = new THREE.Mesh(new THREE.CapsuleGeometry(0.14, 0.55, 5, 10), shellMat);
    upper.rotation.x = Math.PI / 2;
    upper.position.z = 0.38;
    upper.castShadow = true;
    root.add(upper);

    const elbow = new THREE.Group();
    elbow.position.z = 0.72;
    elbow.add(new THREE.Mesh(new THREE.SphereGeometry(0.17, 12, 10), darkMat));
    const fore = new THREE.Mesh(new THREE.CapsuleGeometry(0.12, 0.42, 5, 10), shellMat);
    fore.rotation.x = Math.PI / 2;
    fore.position.z = 0.30;
    fore.castShadow = true;
    elbow.add(fore);
    root.add(elbow);

    const pincer = new THREE.Group();
    pincer.position.z = 0.72;
    const palm = new THREE.Mesh(new THREE.SphereGeometry(0.44, 20, 14), shellMat);
    palm.scale.set(0.95, 0.82, 1.15);
    palm.castShadow = true;
    pincer.add(palm);
    const fixed = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.70, 8), shellLight);
    fixed.rotation.x = Math.PI / 2;
    fixed.position.set(-0.18, 0.05, 0.46);
    fixed.castShadow = true;
    pincer.add(fixed);
    const movingPivot = new THREE.Group();
    movingPivot.position.set(0.18, 0.05, 0.20);
    const moving = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.66, 8), shellLight);
    moving.rotation.x = Math.PI / 2;
    moving.position.z = 0.28;
    moving.castShadow = true;
    movingPivot.add(moving);
    pincer.add(movingPivot);
    elbow.add(pincer);
    inner.add(root);
    claws.push({ root, elbow, pincer, movingPivot, side });
  }

  // 眼柄
  const eyes = [];
  for (const side of [-1, 1]) {
    const eyeRoot = new THREE.Group();
    eyeRoot.position.set(side * 0.55, 0.95, 2.05);
    eyeRoot.rotation.x = 1.05;
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.075, 0.55, 8), shellMat);
    stalk.position.y = 0.27;
    eyeRoot.add(stalk);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.20, 18, 14), eyeWhiteMat);
    ball.position.y = 0.60;
    eyeRoot.add(ball);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.11, 14, 10), pupilMat);
    pupil.position.set(0, 0.62, 0.15);
    eyeRoot.add(pupil);
    const shine = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), shineMat);
    shine.position.set(-0.045, 0.68, 0.23);
    eyeRoot.add(shine);
    inner.add(eyeRoot);
    eyes.push(eyeRoot);
  }

  // 触角
  for (const side of [-1, 1]) {
    const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.02, 0.95, 5), darkMat);
    antenna.rotation.x = 1.18;
    antenna.rotation.z = side * 0.20;
    antenna.position.set(side * 0.75, 0.90, 2.30);
    inner.add(antenna);
  }

  // 口器
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 10), underMat);
  mouth.scale.set(1.1, 0.35, 0.5);
  mouth.position.set(0, 0.15, 2.15);
  inner.add(mouth);

  const update = (t, dt, ctx) => {
    const p = crabState.progress;
    const e = smoothstep(0.22, 0.85, p);
    const rumble = smoothstep(0.0, 0.12, p) * (1 - smoothstep(0.22, 0.42, p));
    const settle = smoothstep(0.85, 1.0, p);
    const bodyY = CRAB_HIDDEN_Y + e * CRAB_STAND_RISE;

    // 山盖开始抬起（e>0）之前，整只蟹保持隐藏，避免眼柄/钳子提前穿帮
    g.visible = e > 0.001;
    g.position.y = bodyY;
    g.rotation.z = Math.sin(t * 41) * 0.018 * rumble + Math.sin(t * 1.7) * 0.006 * settle;
    g.rotation.x = Math.cos(t * 37) * 0.014 * rumble;
    g.rotation.y = 0.16 + Math.sin(t * 0.6) * 0.02 * settle;

    // 山体跟着蟹背升起，并往下压 0.35 坐在甲壳上，避免看起来悬空
    mountainGroup.position.y = e * (CRAB_STAND_RISE - CRAB_CAP_SEAT);
    mountainGroup.rotation.z = g.rotation.z * 0.7;
    mountainGroup.rotation.x = g.rotation.x * 0.7;
    const capOpen = e > 0.001;
    if (capSideMesh) capSideMesh.visible = capOpen;
    if (capUnderMesh) capUnderMesh.visible = capOpen;

    for (const leg of legs) {
      const walk = Math.sin(t * 1.6 + leg.li * 1.3 + leg.side) * 0.025 * settle;
      leg.hip.rotation.z = THREE.MathUtils.lerp(1.15, -0.16, e)
        + Math.sin(t * 47) * 0.02 * rumble + walk;
      leg.knee.rotation.z = THREE.MathUtils.lerp(-2.05, -0.78, e) + walk * 0.5;
      leg.ankle.rotation.z = THREE.MathUtils.lerp(-1.0, -0.35, e) + walk * 0.4;
    }

    for (const c of claws) {
      const open = smoothstep(0.55, 0.90, p);
      c.root.rotation.z = THREE.MathUtils.lerp(-0.35, -0.10, e)
        + Math.sin(t * 1.4 + c.side) * 0.025 * settle;
      c.root.rotation.x = THREE.MathUtils.lerp(0.25, 0.05, e);
      c.elbow.rotation.x = THREE.MathUtils.lerp(0.20, -0.10, e);
      c.movingPivot.rotation.y = THREE.MathUtils.lerp(0.35, -0.28 - open * 0.18, e)
        + Math.sin(t * 2.0 + c.side) * 0.02 * settle;
    }

    for (const eye of eyes) {
      eye.rotation.x = THREE.MathUtils.lerp(1.05, 0.12, smoothstep(0.45, 0.82, p))
        + Math.sin(t * 1.5 + eye.position.x) * 0.03 * settle;
      eye.rotation.z = Math.sin(t * 1.1 + eye.position.x) * 0.04 * settle;
    }

    crabState.shake = rumble + 0.05 * settle;
    crabState.emerging = p > 0.02;
    if (!crabState.pierDestroyed && p > 0.24) {
      crabState.pierDestroyed = true;
      destroyPier();
    }
  };

  return makeCreature('islandCrab', g, inner, {
    update,
    randomize: () => {},
    glowMats: [],
    noSquish: true,
  });
}

const islandCrab = buildGiantCrab();

function makeSkullTexture() {
  const c = document.createElement('canvas');
  c.width = 160; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#161413';
  g.fillRect(0, 0, 160, 128);
  g.fillStyle = '#f5ead4';
  g.beginPath();
  g.arc(80, 50, 26, 0, Math.PI * 2);
  g.fill();
  g.fillRect(64, 68, 32, 20);
  g.fillStyle = '#161413';
  g.beginPath();
  g.arc(69, 47, 7, 0, Math.PI * 2);
  g.arc(91, 47, 7, 0, Math.PI * 2);
  g.fill();
  g.beginPath();
  g.moveTo(80, 54); g.lineTo(86, 64); g.lineTo(74, 64); g.closePath(); g.fill();
  g.strokeStyle = '#f5ead4';
  g.lineWidth = 7;
  g.lineCap = 'round';
  g.beginPath();
  g.moveTo(40, 92); g.lineTo(120, 112);
  g.moveTo(120, 92); g.lineTo(40, 112);
  g.stroke();
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeHullShape(scale = 1) {
  const s = new THREE.Shape();
  const k = scale;
  s.moveTo(-0.62 * k, -0.16 * k);
  s.quadraticCurveTo(-0.36 * k, -0.30 * k, 0.12 * k, -0.27 * k);
  s.quadraticCurveTo(0.48 * k, -0.23 * k, 0.70 * k, 0);
  s.quadraticCurveTo(0.48 * k, 0.23 * k, 0.12 * k, 0.27 * k);
  s.quadraticCurveTo(-0.36 * k, 0.30 * k, -0.62 * k, 0.16 * k);
  s.quadraticCurveTo(-0.69 * k, 0, -0.62 * k, -0.16 * k);
  return s;
}
function makeSailTexture() {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  g.fillStyle = '#fff4dd';
  g.fillRect(0, 0, 128, 128);
  g.fillStyle = 'rgba(199,86,58,.82)';
  g.fillRect(0, 82, 128, 13);
  g.fillStyle = 'rgba(199,86,58,.42)';
  g.fillRect(0, 66, 128, 4);
  g.strokeStyle = 'rgba(120,90,60,.16)';
  g.lineWidth = 1;
  for (let x = 16; x < 128; x += 24) {
    g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 128); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
function addRigging(parent, a, b, mat) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.0035, 0.0035, len, 4), mat);
  mesh.position.copy(a).addScaledVector(dir, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  parent.add(mesh);
  return mesh;
}

function buildShip() {
  const g = new THREE.Group();
  const inner = new THREE.Group();
  g.add(inner);

  const hullMat = jellyMat(0x8a4f2f, { opacity: 0.95, iridescence: 0.1 });
  const hullDark = jellyMat(0x5a3220, { opacity: 0.96 });
  const deckMat = jellyMat(0xd9a86a, { opacity: 0.95 });
  const trimMat = new THREE.MeshStandardMaterial({ color: 0x4a2c1a, roughness: 0.72 });
  const mastMat = new THREE.MeshStandardMaterial({ color: 0x4b3323, roughness: 0.7 });
  const sailMat = new THREE.MeshStandardMaterial({
    map: makeSailTexture(), side: THREE.DoubleSide, roughness: 0.74, metalness: 0,
  });
  const jibMat = new THREE.MeshStandardMaterial({
    color: 0xfff2d8, side: THREE.DoubleSide, roughness: 0.78, metalness: 0,
  });

  // 船体：俯视轮廓挤出 + 船腹，让它从侧面看也像一艘船
  const hullShape = makeHullShape(1);
  const hullGeo = new THREE.ExtrudeGeometry(hullShape, {
    depth: 0.20, bevelEnabled: true, bevelThickness: 0.05,
    bevelSize: 0.045, bevelSegments: 2, curveSegments: 18,
  });
  hullGeo.rotateX(-Math.PI / 2);
  const hull = new THREE.Mesh(hullGeo, hullMat);
  hull.position.y = 0;
  hull.castShadow = true;
  inner.add(hull);

  const belly = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 16), hullDark);
  belly.scale.set(0.98, 0.32, 0.40);
  belly.position.y = 0.03;
  belly.castShadow = true;
  inner.add(belly);

  // 舷缘：一圈深色船沿，读起来像甲板边
  const gunwaleShape = makeHullShape(1);
  gunwaleShape.holes.push(makeHullShape(0.86));
  const gunwaleGeo = new THREE.ExtrudeGeometry(gunwaleShape, {
    depth: 0.10, bevelEnabled: true, bevelThickness: 0.018,
    bevelSize: 0.018, bevelSegments: 1, curveSegments: 18,
  });
  gunwaleGeo.rotateX(-Math.PI / 2);
  const gunwale = new THREE.Mesh(gunwaleGeo, trimMat);
  gunwale.position.y = 0.20;
  gunwale.castShadow = true;
  inner.add(gunwale);

  const deck = new THREE.Mesh(
    new THREE.ShapeGeometry(makeHullShape(0.86), 18).rotateX(-Math.PI / 2),
    deckMat
  );
  deck.position.y = 0.238;
  inner.add(deck);

  // 船尾小舱
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.16, 0.24, 2, 2, 2), jellyMat(0xc58b56, { opacity: 0.92 }));
  cabin.position.set(-0.42, 0.32, 0);
  cabin.castShadow = true;
  inner.add(cabin);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.035, 0.28), jellyMat(0x7a4a2c, { opacity: 0.95 }));
  roof.position.set(-0.42, 0.415, 0);
  inner.add(roof);

  // 桅杆与横桁
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.022, 0.98, 10), mastMat);
  mast.position.set(0.02, 0.72, 0);
  mast.castShadow = true;
  inner.add(mast);
  const yard = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.68, 8), mastMat);
  yard.position.set(0.02, 0.93, 0);
  yard.rotation.x = Math.PI / 2;
  inner.add(yard);

  // 帆：软布，逐帧做一点波动
  const sailGeo = new THREE.PlaneGeometry(0.64, 0.52, 14, 10);
  sailGeo.rotateY(Math.PI / 2);
  const sail = new THREE.Mesh(sailGeo, sailMat);
  sail.position.set(0.02, 0.72, -0.02);
  inner.add(sail);
  const sailBase = sailGeo.attributes.position.array.slice();
  sail.castShadow = true;

  // 副帆：与主帆交叉，任何航向都能看到帆影
  const jibShape = new THREE.Shape();
  jibShape.moveTo(0, 0);
  jibShape.lineTo(0, 0.46);
  jibShape.lineTo(0.44, 0.04);
  jibShape.closePath();
  const jib = new THREE.Mesh(new THREE.ShapeGeometry(jibShape, 12), jibMat);
  jib.position.set(0.02, 0.36, 0.02);
  jib.rotation.y = -0.30;
  jib.castShadow = true;
  inner.add(jib);

  // 骷髅旗
  const flagTex = makeSkullTexture();
  const flagGeo = new THREE.PlaneGeometry(0.30, 0.20, 8, 4);
  flagGeo.rotateY(Math.PI / 2);
  const flag = new THREE.Mesh(flagGeo, new THREE.MeshStandardMaterial({
    map: flagTex, side: THREE.DoubleSide, roughness: 0.8, transparent: true,
  }));
  flag.position.set(0.02, 1.22, -0.15);
  inner.add(flag);
  const flagBase = flagGeo.attributes.position.array.slice();

  // 交叉的小三角旗：骷髅旗侧对镜头时仍有旗影
  const pennantShape = new THREE.Shape();
  pennantShape.moveTo(0, 0);
  pennantShape.lineTo(0.24, 0.05);
  pennantShape.lineTo(0, 0.13);
  pennantShape.closePath();
  const pennant = new THREE.Mesh(
    new THREE.ShapeGeometry(pennantShape),
    new THREE.MeshStandardMaterial({ color: 0x1c1815, side: THREE.DoubleSide, roughness: 0.8 })
  );
  pennant.position.set(0.02, 1.07, 0.02);
  inner.add(pennant);

  // 缆绳，让船在逆光时也有轮廓
  addRigging(inner, new THREE.Vector3(0.02, 1.19, 0), new THREE.Vector3(0.66, 0.30, 0), mastMat);
  addRigging(inner, new THREE.Vector3(0.02, 1.19, 0), new THREE.Vector3(-0.60, 0.34, 0), mastMat);
  addRigging(inner, new THREE.Vector3(0.02, 1.19, 0), new THREE.Vector3(0.02, 0.30, 0.24), mastMat);
  addRigging(inner, new THREE.Vector3(0.02, 1.19, 0), new THREE.Vector3(0.02, 0.30, -0.24), mastMat);

  // 船首斜桅
  const bowsprit = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.014, 0.34, 6), mastMat);
  bowsprit.position.set(0.68, 0.27, 0);
  bowsprit.rotation.z = Math.PI / 2 - 0.28;
  inner.add(bowsprit);

  // 小炮
  for (const sz of [-1, 1]) {
    for (let i = 0; i < 3; i++) {
      const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.025, 0.09, 8), mastMat);
      cannon.rotation.x = Math.PI / 2;
      cannon.position.set(-0.22 + i * 0.16, 0.19, sz * 0.20);
      inner.add(cannon);
    }
  }

  // 夜间舷灯
  const lantern = new THREE.PointLight(0xffb469, 0, 2.4, 2);
  lantern.position.set(0, 1.05, 0.16);
  inner.add(lantern);
  const lanternOrb = new THREE.Mesh(
    new THREE.SphereGeometry(0.022, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xffc27a })
  );
  lanternOrb.position.copy(lantern.position);
  inner.add(lanternOrb);

  g.position.set(-4.2, 0, 4.2);
  g.scale.setScalar(1.0);

  let lastWake = 0;
  const shipPath = { cx: -4.2, cz: 4.2, rx: 2.9, rz: 2.6, phase: 0.7 };
  const update = (t, dt, ctx) => {
    const a = t * 0.10 + shipPath.phase;
    const rx = shipPath.rx, rz = shipPath.rz;
    const x = shipPath.cx + Math.cos(a) * rx;
    const z = shipPath.cz + Math.sin(a) * rz;
    const dx = -Math.sin(a) * rx;
    const dz = Math.cos(a) * rz;
    const heading = Math.atan2(-dz, dx);

    const h = sampleSeaHeight(x, z);
    const hx = sampleSeaHeight(x + 0.35, z);
    const hz = sampleSeaHeight(x, z + 0.35);
    const slopeX = (hx - h) / 0.35;
    const slopeZ = (hz - h) / 0.35;

    g.position.set(x, h - 0.045, z);
    g.rotation.y = heading;
    g.rotation.z = THREE.MathUtils.clamp(-slopeX * 1.1, -0.2, 0.2);
    g.rotation.x = THREE.MathUtils.clamp(slopeZ * 1.1, -0.2, 0.2);

    // 帆与旗的软布波动
    const sp = sailGeo.attributes.position;
    for (let i = 0; i < sp.count; i++) {
      const bx = sailBase[i * 3], by = sailBase[i * 3 + 1], bz = sailBase[i * 3 + 2];
      const u = (by + 0.26) / 0.52;
      const bulge = Math.sin(u * Math.PI) * 0.055;
      sp.setX(i, bx + bulge + Math.sin(t * 2.6 + u * 5.0) * 0.02 * u);
      sp.setY(i, by + Math.cos(t * 1.7 + u * 3.0) * 0.006);
      sp.setZ(i, bz);
    }
    sp.needsUpdate = true;
    sailGeo.computeVertexNormals();

    const fp = flagGeo.attributes.position;
    for (let i = 0; i < fp.count; i++) {
      const bx = flagBase[i * 3], by = flagBase[i * 3 + 1], bz = flagBase[i * 3 + 2];
      const u = (bz + 0.15) / 0.30;
      fp.setX(i, bx + Math.sin(u * Math.PI) * 0.028 + Math.sin(t * 4.2 + u * 7.0) * 0.028 * u);
      fp.setY(i, by + Math.cos(t * 2.4 + u * 4.0) * 0.006);
    }
    fp.needsUpdate = true;

    lantern.intensity = ctx.night * 1.8;
    lanternOrb.material.color.setHex(ctx.night > 0.4 ? 0xffc27a : 0x8a6a45);
    lanternOrb.visible = ctx.night > 0.15;
    sailMat.emissiveIntensity = ctx.night * 0.15;

    // 船尾拖出真实尾迹
    if (t - lastWake > 0.55) {
      lastWake = t;
      addDrop(
        x - Math.cos(heading) * 0.85,
        z + Math.sin(heading) * 0.85,
        0.035,
        0.55
      );
    }
  };

  const shipCreature = makeCreature('ship', g, inner, {
    update,
    parent: scene,
    reset: () => {
      shipPath.cx = -4.2; shipPath.cz = 4.2;
      shipPath.rx = 2.9; shipPath.rz = 2.6; shipPath.phase = 0.7;
    },
    randomize: () => {
      shipPath.cx = -4.2 + (Math.random() - 0.5) * 0.6;
      shipPath.cz = 4.2 + (Math.random() - 0.5) * 0.6;
      shipPath.rx = 2.7 + Math.random() * 0.3;
      shipPath.rz = 2.4 + Math.random() * 0.3;
      shipPath.phase = Math.random() * Math.PI * 2;
      g.scale.setScalar(0.92 + Math.random() * 0.14);
    },
    glowMats: [sailMat],
  });
  shipCreature.isShip = true;
  shipCreature.lantern = lantern;
  return shipCreature;
}

    d.mesh.rotation.z += dt * 2.1;

  }
}

function makeMudTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 2, 32, 32, 30);
  grad.addColorStop(0, 'rgba(255,246,226,0.9)');
  grad.addColorStop(0.45, 'rgba(214,188,148,0.55)');
  grad.addColorStop(1, 'rgba(160,132,94,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const MUD_COUNT = 300;
const mudPositions = new Float32Array(MUD_COUNT * 3);
const mudVelocity = new Float32Array(MUD_COUNT * 3);
const mudLife = new Float32Array(MUD_COUNT);
const MUD_CX = ISLAND_C.x;
const MUD_CZ = ISLAND_C.z;
function respawnMud(i) {
  const a = Math.random() * Math.PI * 2;
  const r = 2.4 + Math.random() * 3.8;
  mudPositions[i * 3] = MUD_CX + Math.cos(a) * r;
  mudPositions[i * 3 + 1] = waterLevel - 0.6 + Math.random() * 1.5;
  mudPositions[i * 3 + 2] = MUD_CZ + Math.sin(a) * r;
  const out = 0.10 + Math.random() * 0.45;
  mudVelocity[i * 3] = Math.cos(a) * out;
  mudVelocity[i * 3 + 1] = 0.18 + Math.random() * 0.55;
  mudVelocity[i * 3 + 2] = Math.sin(a) * out;
  mudLife[i] = 1.2 + Math.random() * 2.6;
}
for (let i = 0; i < MUD_COUNT; i++) respawnMud(i);
const mudGeo = new THREE.BufferGeometry();
mudGeo.setAttribute('position', new THREE.BufferAttribute(mudPositions, 3));
const mudMat = new THREE.PointsMaterial({
  map: makeMudTexture(), color: 0x8d6b47, size: 8.2,
  sizeAttenuation: false, transparent: true, opacity: 0,
  depthWrite: false,
});
const mudPoints = new THREE.Points(mudGeo, mudMat);
mudPoints.renderOrder = 3;
mudPoints.visible = false;
scene.add(mudPoints);
function updateMud(dt) {
  const active = crabState.pollution > 0.02 || crabState.progress > 0.05;
  mudPoints.visible = active;
  if (!active) return;
  mudMat.opacity = Math.min(0.72, crabState.pollution * 0.56 + smoothstep(0.05, 0.35, crabState.progress) * 0.12);
  for (let i = 0; i < MUD_COUNT; i++) {
    const ix = i * 3;
    const dx = mudPositions[ix] - MUD_CX;
    const dz = mudPositions[ix + 2] - MUD_CZ;
    const rr = Math.hypot(dx, dz) || 1;
    mudVelocity[ix] += (-dz / rr) * 0.10 * dt;
    mudVelocity[ix + 2] += (dx / rr) * 0.10 * dt;
    mudVelocity[ix + 1] += 0.04 * dt;
    mudPositions[ix] += mudVelocity[ix] * dt;
    mudPositions[ix + 1] += mudVelocity[ix + 1] * dt;
    mudPositions[ix + 2] += mudVelocity[ix + 2] * dt;
    mudLife[i] -= dt;
    const outR = Math.hypot(mudPositions[ix] - MUD_CX, mudPositions[ix + 2] - MUD_CZ);
    if (mudLife[i] <= 0 || mudPositions[ix + 1] > waterLevel + 0.9 || outR > 6.8) {
      respawnMud(i);
    }
  }
  mudGeo.attributes.position.needsUpdate = true;
}

const rippleRingGeo = new THREE.RingGeometry(0.76, 1.0, 64).rotateX(-Math.PI / 2);
{
  const rp = rippleRingGeo.attributes.position;
  const rc = [];
  const innerC = new THREE.Color(0xffffff);
  const outerC = new THREE.Color(0x1c8f94);
  const tmpC = new THREE.Color();
  for (let i = 0; i < rp.count; i++) {
    const rr = Math.hypot(rp.getX(i), rp.getZ(i));
    const t = THREE.MathUtils.clamp((rr - 0.76) / 0.24, 0, 1);
    tmpC.copy(innerC).lerp(outerC, t);
    rc.push(tmpC.r, tmpC.g, tmpC.b);
  }
  rippleRingGeo.setAttribute('color', new THREE.Float32BufferAttribute(rc, 3));
}
const rippleRings = [];
for (let i = 0; i < 18; i++) {
  const mesh = new THREE.Mesh(rippleRingGeo, new THREE.MeshBasicMaterial({
    color: 0xffffff, vertexColors: true, transparent: true, opacity: 0,
    depthWrite: false, side: THREE.DoubleSide,
  }));
  mesh.visible = false;
  mesh.renderOrder = 5;
  scene.add(mesh);
  rippleRings.push({ mesh, life: 0, max: 1, baseOpacity: 0.3 });
}
function spawnRipple(x, z, strength = 0.7) {
  addDrop(x, z, 0.035 + 0.075 * strength, 0.58);
  let ring = rippleRings.find((r) => r.life <= 0);
  if (!ring) ring = rippleRings[0];
  ring.life = 1;
  ring.max = 0.85 + 1.25 * strength;
  ring.baseOpacity = Math.min(0.78, 0.40 + 0.28 * strength);
  ring.mesh.position.set(x, waterLevel + 0.06, z);
  ring.mesh.scale.setScalar(0.35);
  ring.mesh.material.opacity = ring.baseOpacity;
  ring.mesh.visible = true;
}
function localPointFromEvent(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  return new THREE.Vector2(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top) / rect.height) * 2 + 1
  );
}
const raycaster = new THREE.Raycaster();
const seaPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function insideBlock(x, z, margin = 0) {
  const s = BLOCK_SIZE - margin * 2;
  const r = Math.max(0.001, BLOCK_RADIUS - margin);
  const b = s / 2;
  const qx = Math.abs(x) - b + r;
  const qz = Math.abs(z) - b + r;
  return Math.hypot(Math.max(qx, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qz), 0) - r <= 0;
}
function waterHit(e) {
  const ndc = localPointFromEvent(e);
  raycaster.setFromCamera(ndc, camera);
  seaPlane.constant = -waterLevel;
  const pt = new THREE.Vector3();
  if (!raycaster.ray.intersectPlane(seaPlane, pt)) return null;
  if (!insideBlock(pt.x, pt.z, 0.12)) return null;
  if (terrainHeight(pt.x, pt.z) > waterLevel - 0.02) return null;
  return pt;
}

/* 交互                                                                 */
/* ------------------------------------------------------------------ */
let pointerDown = null;
let pointerMoved = false;
let lastRippleAt = 0;
let draggingWater = false;

function releaseWaterDrag() {
  if (draggingWater) {
    draggingWater = false;
    controls.enableRotate = true;
  }
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return;
  pointerDown = { x: e.clientX, y: e.clientY, t: performance.now() };
  pointerMoved = false;
  const hit = waterHit(e);
  if (hit) {
    draggingWater = true;
    controls.enableRotate = false;
    spawnRipple(hit.x, hit.z, 0.9);
    lastRippleAt = performance.now();
  }
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!pointerDown) return;
  const dx = e.clientX - pointerDown.x;
  const dy = e.clientY - pointerDown.y;
  if (Math.hypot(dx, dy) > 5) pointerMoved = true;
  if (pointerMoved && performance.now() - lastRippleAt > 95) {
    const hit = waterHit(e);
    if (hit) {
      spawnRipple(hit.x, hit.z, 0.45);
      lastRippleAt = performance.now();
    }
  }
});

function pickCreature(e) {
  raycaster.setFromCamera(localPointFromEvent(e), camera);
  const hits = raycaster.intersectObjects(clickTargets, true);
  for (const hit of hits) {
    let node = hit.object;
    while (node && !node.userData.creatureId) node = node.parent;
    if (!node) continue;
    const creature = creatures.find((c) => c.group === node);
    if (!creature) continue;
    if (!creature.group.visible) continue;
    if (creature.id === 'islandCrab' && crabState.progress < 0.05) continue;
    return creature;
  }
  return null;
}

renderer.domElement.addEventListener('pointerup', (e) => {
  releaseWaterDrag();
  if (!pointerDown) return;
  const wasClick = !pointerMoved && performance.now() - pointerDown.t < 600;
  pointerDown = null;
  if (!wasClick) return;

  const creature = pickCreature(e);
  if (creature) {
    creature.squishVel -= 5.2;
    focusOn(creature);
    return;
  }
  const hit = waterHit(e);
  if (hit) {
    spawnRipple(hit.x, hit.z, 1.0);
    clearFocus();
  } else {
    clearFocus();
  }
});

window.addEventListener('pointerup', releaseWaterDrag);
window.addEventListener('pointercancel', releaseWaterDrag);

// 让指针在可点击物上变成小手
let lastHoverRipple = 0;
renderer.domElement.addEventListener('pointermove', (e) => {
  if (pointerDown) return;
  renderer.domElement.style.cursor = pickCreature(e) ? 'pointer' : 'default';
  const now = performance.now();
  if (now - lastHoverRipple > 110) {
    const hit = waterHit(e);
    if (hit) {
      spawnRipple(hit.x, hit.z, 0.28);
      lastHoverRipple = now;
    }
  }
});

  ui.wave.value = '55'; ui.waveVal.textContent = '55';
  ui.clarity.value = '62'; ui.clarityVal.textContent = '62';
  ui.soft.value = '66'; ui.softVal.textContent = '66';
  ui.day.value = '88'; ui.dayVal.textContent = '88';
  ui.autoTide.checked = true;
  ui.pause.textContent = '暂停';
  simTime = 0;
  for (const c of creatures) {
    if (c.reset) c.reset();
    c.group.position.copy(c.home);
    c.group.rotation.y = c.homeRotY;
    c.group.scale.copy(c.homeScale);
    c.squish = 0;
    c.squishVel = 0;
  }
  seaSim.h.fill(0);
  seaSim.hNext.fill(0);
  seaSim.v.fill(0);
  heightTex.needsUpdate = true;
  camera.zoom = 1;
  camera.updateProjectionMatrix();
  controls.target.copy(defaultTarget);
  controls.update();
  clearFocus();
  for (const k of Object.keys(visibility)) visibility[k] = true;
  syncVisibilityUI();

  // 岛蟹回到沉睡，浊水慢慢澄清，碎石清空
  crabState.awake = false;
  crabState.target = 0;
  crabState.progress = 0;
  crabState.pollution = 0;
  crabState.pollutionTarget = 0;
  crabState.debrisBudget = 0;
  crabState.debrisTimer = 0;
  crabState.shake = 0;
  crabState.emerging = false;
  crabState.pierDestroyed = false;
  restorePier();
  mountainGroup.position.y = 0;
  mountainGroup.rotation.set(0, 0, 0);
  if (capSideMesh) capSideMesh.visible = false;
  if (capUnderMesh) capUnderMesh.visible = false;
  mudMat.opacity = 0;
  mudPoints.visible = false;
  for (const d of debrisPool) {
    d.active = false;
    d.mesh.visible = false;
  }
  ui.wake.classList.remove('awake');
  ui.wake.textContent = '唤醒岛蟹 · wake the island';
  islandGroup.position.set(ISLAND_C.x, 0, ISLAND_C.z);
  islandGroup.rotation.set(0, 0, 0);
  waterUniforms.uPollution.value = 0;
  waterWallUniforms.uPollution.value = 0;
  causticUniforms.uPollution.value = 0;
  soilWallUniforms.uNight.value = nightFactor;
});

ui.rand.addEventListener('click', () => {
  clearFocus();
  for (const c of creatures) {
    if (c.randomize) c.randomize();
    c.squishVel -= 2.5;
  }
  for (let i = 0; i < 4; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = 6.5 + Math.random() * 5.0;
    addDrop(Math.cos(a) * r, Math.sin(a) * r, 0.08, 0.7);
  }
});

function syncVisibilityUI() {
  for (const btn of ui.pills.children) {
    const key = btn.dataset.species;
    const on = visibility[key] !== false;
    btn.classList.toggle('on', on);
    const c = creatures.find((x) => x.id === key);
    if (c) c.group.visible = on;
  }
}

function triggerSquishAll() {
  for (const c of creatures) c.squishVel -= 3.0;
}
renderer.domElement.addEventListener('dblclick', triggerSquishAll);

/* ------------------------------------------------------------------ */
/* 昼夜与主循环                                                         */
/* ------------------------------------------------------------------ */
const skyDay = new THREE.Color(0xfff6e6);
const skyNight = new THREE.Color(0x18223a);
const deepDay = new THREE.Color(0x178f99);
const deepNight = new THREE.Color(0x0b3140);
const midDay = new THREE.Color(0x39c9bd);
const midNight = new THREE.Color(0x155a68);
const shallowDay = new THREE.Color(0x9beadd);
const shallowNight = new THREE.Color(0x2a8f8a);
const sunDay = new THREE.Color(0xfff1d4);
const sunNight = new THREE.Color(0x9db8ff);
const hemiDay = new THREE.Color(0xfff6e6);
const hemiNight = new THREE.Color(0x25324c);
const groundDay = new THREE.Color(0xb9a88c);
const groundNight = new THREE.Color(0x1a2233);
const poolClean = new THREE.Color(0x58d2c4);
const poolMurk = new THREE.Color(0x5e5a3a);

let simTime = 0;
const clock = new THREE.Clock();
let nightFactor = 0;

function updateEnvironment(t, dt) {
  nightFactor = 1 - params.daylight;
  const n = nightFactor;

  hemi.color.copy(hemiDay).lerp(hemiNight, n);
  hemi.groundColor.copy(groundDay).lerp(groundNight, n);
  hemi.intensity = 1.15 - n * 0.68;

  sun.color.copy(sunDay).lerp(sunNight, n);
  sun.intensity = 2.7 - n * 2.15;
  fill.intensity = 0.55 - n * 0.25;
  renderer.toneMappingExposure = 1.06 - n * 0.12;

  waterUniforms.uSky.value.copy(skyDay).lerp(skyNight, n);
  waterUniforms.uHorizon.value.setHex(0xdff4ee).lerp(new THREE.Color(0x101a2c), n);
  waterUniforms.uDeep.value.copy(deepDay).lerp(deepNight, n);
  waterUniforms.uMid.value.copy(midDay).lerp(midNight, n);
  waterUniforms.uShallow.value.copy(shallowDay).lerp(shallowNight, n);
  waterUniforms.uSun.value.copy(sunDay).lerp(sunNight, n);
  waterUniforms.uNight.value = n;

  waterWallUniforms.uSky.value.copy(skyDay).lerp(skyNight, n);
  waterWallUniforms.uDeep.value.copy(deepDay).lerp(deepNight, n);
  waterWallUniforms.uMid.value.copy(midDay).lerp(midNight, n);
  waterWallUniforms.uShallow.value.copy(shallowDay).lerp(shallowNight, n);
  waterWallUniforms.uNight.value = n;
  soilWallUniforms.uNight.value = n;

  bioMat.opacity = n * (0.55 + 0.45 * Math.sin(t * 2.2)) * (1 - crabState.pollution * 0.75);

  const lh = lighthouse.userData;
  if (lh.light) lh.light.intensity = n * 1.7;
  if (lh.lightOrb) lh.lightOrb.material.color.setHex(n > 0.25 ? 0xffd58a : 0x8a6a45);
  if (lh.beam) {
    lh.beam.visible = n > 0.12;
    lh.beam.material.opacity = n * 0.14;
  }
  if (pier.userData.light) pier.userData.light.intensity = n * 1.1;

  document.body.classList.toggle('night', n > 0.55);
}

function updateGlow() {
  const n = nightFactor;
  const pulse = 0.55 + 0.45 * Math.sin(simTime * 1.8);
  for (const c of creatures) {
    for (const m of c.glowMats) {
      m.emissive.setHex(0x2affc8);
      m.emissiveIntensity = n * 0.9 * pulse;
    }
  }
}

const loader = document.getElementById('loader');
if (qp.get('shot') === '1') loader.remove();
let firstFrame = true;

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  if (!params.paused) simTime += dt;
  const t = simTime;

  if (params.autoTide && !params.paused) {
    params.tide = 0.5 + 0.5 * Math.sin(t * 0.16);
    ui.tide.value = String(Math.round(params.tide * 100));
    ui.tideVal.textContent = String(Math.round(params.tide * 100));
  }

  waterLevel = SEA_BASE + (params.tide - 0.5) * TIDE_AMPLITUDE;
  nearSea.position.y = waterLevel;
  waterUniforms.uWaterLevel.value = waterLevel;
  waterWallUniforms.uWaterLevel.value = waterLevel;
  causticUniforms.uWaterLevel.value = waterLevel;
  bioPoints.position.y = waterLevel + 0.025;

  if (!params.paused) updateSeaSim(dt);

  // 岛蟹苏醒：先震，再破土站起；整段约 8.5 秒
  const prevProgress = crabState.progress;
  const progressDir = crabState.target > crabState.progress ? 1 : crabState.target < crabState.progress ? -1 : 0;
  if (progressDir !== 0) {
    const duration = progressDir > 0 ? 8.5 : 5.0;
    crabState.progress = THREE.MathUtils.clamp(
      crabState.progress + progressDir * dt / duration,
      0, 1
    );
  }
  crabState.pollutionTarget = smoothstep(0.02, 0.52, crabState.progress);
  crabState.pollution = THREE.MathUtils.damp(crabState.pollution, crabState.pollutionTarget, 0.55, dt);

  causticUniforms.uTime.value = t;
  causticUniforms.uTide.value = params.tide;
  causticUniforms.uNight.value = nightFactor;
  causticUniforms.uPollution.value = crabState.pollution;
  waterWallUniforms.uTime.value = t;
  waterWallUniforms.uNight.value = nightFactor;
  waterWallUniforms.uPollution.value = crabState.pollution;
  waterWallUniforms.uClarity.value = params.clarity;
  soilWallUniforms.uNight.value = nightFactor;
  bubbles.rotation.y = t * 0.02;

  // 破土/站起两次冲击：沿岛岸推一圈真实水波
  if (
    (prevProgress < 0.20 && crabState.progress >= 0.20) ||
    (prevProgress < 0.44 && crabState.progress >= 0.44)
  ) {
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + Math.random() * 0.2;
      const R = shoreRadius(a) + 0.25;
      addDrop(
        ISLAND_C.x + Math.cos(a) * R,
        ISLAND_C.z + Math.sin(a) * R,
        0.055,
        0.75
      );
    }
  }

  if (crabState.debrisBudget > 0 && crabState.progress > 0.08) {
    crabState.debrisTimer -= dt;
    if (crabState.debrisTimer <= 0) {
      spawnDebris();
      crabState.debrisBudget--;
      crabState.debrisTimer = 0.035 + Math.random() * 0.06;
    }
  }
  updateDebris(dt, waterLevel);
  updatePierDebris(dt);
  updateMud(dt);

  const crabShake = crabState.shake;
  const crabEase = smoothstep(0.22, 0.85, crabState.progress);
  islandGroup.rotation.z = Math.sin(t * 41) * 0.012 * crabShake;
  islandGroup.rotation.x = Math.cos(t * 37) * 0.009 * crabShake;
  islandGroup.position.y = Math.sin(t * 33) * 0.02 * crabShake + crabEase * 0.04;

  // 岛身晃动时向海里推出一圈圈波
  if (crabShake > 0.02) {
    for (let i = 0; i < 3; i++) {
      const a = Math.random() * Math.PI * 2;
      const R = shoreRadius(a) + 0.18;
      addDrop(
        ISLAND_C.x + Math.cos(a) * R,
        ISLAND_C.z + Math.sin(a) * R,
        0.038 * crabShake,
        0.55
      );
    }
  }

  siltPoints.position.y = waterLevel + 0.012;
  siltMat.opacity = crabState.pollution * 0.48;
  siltPoints.rotation.y = t * 0.012;

  flotsam.position.y = waterLevel + 0.012;
  flotsam.visible = crabState.pollution > 0.03;
  flotsamMat.opacity = crabState.pollution * 0.7;
  flotsam.children.forEach((m, i) => {
    m.position.y = Math.sin(t * 1.6 + i * 1.7) * 0.006;
    m.rotation.y += dt * 0.15;
  });

  waterUniforms.uTime.value = t;
  waterUniforms.uTide.value = params.tide;
  waterUniforms.uWaveStrength.value = params.wave;
  waterUniforms.uClarity.value = params.clarity;
  waterUniforms.uPollution.value = crabState.pollution;
  waterUniforms.uWaterLevel.value = waterLevel;

  // 鼠标划过/点击的可见涟漪圈
  for (const r of rippleRings) {
    if (r.life <= 0) continue;
    r.life -= dt * 0.85;
    const p = 1 - Math.max(0, r.life);
    r.mesh.scale.setScalar(0.35 + p * r.max);
    r.mesh.material.opacity = Math.max(0, r.life) * r.baseOpacity;
    r.mesh.position.y = waterLevel + 0.055;
    if (r.life <= 0) {
      r.life = 0;
      r.mesh.visible = false;
    }
  }

  // 潮池：水位随潮汐上涨，水面变大
  for (const pool of pools) {
    const disc = pool.userData.waterDisc;
    const isFish = pool.userData.isFishPool;
    const scale = isFish ? 0.68 + 0.32 * params.tide : 0.2 + 0.8 * params.tide;
    disc.scale.setScalar(scale);
    disc.position.y = 0.020 + params.tide * 0.006;
    disc.material.color.copy(poolClean).lerp(poolMurk, crabState.pollution);
    disc.material.opacity = (0.55 + params.tide * 0.3) * (1 - crabState.pollution * 0.12);
    disc.visible = isFish ? true : params.tide > 0.06;
  }

  // 植物随浪摆动
  for (const p of plants) {
    p.group.rotation.z = Math.sin(t * 1.1 + p.phase) * 0.025;
    p.group.rotation.x = Math.cos(t * 0.9 + p.phase) * 0.02;
  }
  for (const w of weeds) {
    w.mesh.rotation.z = Math.sin(t * 1.4 + w.phase) * 0.14;
    w.mesh.rotation.x = Math.cos(t * 1.0 + w.phase) * 0.06;
  }
  for (const k of kelp) {
    k.mesh.rotation.z = Math.sin(t * 1.15 + k.phase) * 0.10;
    k.mesh.rotation.x = Math.cos(t * 0.85 + k.phase) * 0.05;
  }
  for (const f of decorFish) {
    const a = t * f.speed + f.phase;
    const x = f.cx + Math.cos(a) * f.radius;
    const z = f.cz + Math.sin(a) * f.radius * 0.92;
    const dx = -Math.sin(a) * f.radius;
    const dz = Math.cos(a) * f.radius * 0.92;
    const ground = terrainHeight(x, z);
    const targetY = waterLevel - f.depth + Math.sin(t * 1.1 + f.phase) * 0.05;
    const y = Math.min(waterLevel - 0.18, Math.max(ground + 0.24, targetY));
    f.group.position.set(x, y, z);
    f.group.rotation.y = Math.atan2(-dz, dx);
    f.group.rotation.z = Math.sin(t * 1.3 + f.phase) * 0.06;
    f.tail.rotation.y = Math.sin(t * 9.0 + f.phase) * 0.5;
  }
  for (const p of palms) {
    p.group.rotation.z = Math.sin(t * 0.8 + p.phase) * 0.012;
    p.group.rotation.x = Math.cos(t * 0.65 + p.phase) * 0.008;
    p.pivots.forEach((piv, i) => {
      piv.rotation.x = Math.sin(t * 1.25 + p.phase + i * 0.45) * 0.035;
    });
  }
  for (const pad of lilyPads) {
    pad.position.y = FISH_POOL.surfaceY + 0.004 + Math.sin(t * 1.2 + pad.position.x) * 0.002;
  }
  for (const b of birds) {
    const a = t * b.speed + b.phase;
    b.group.position.set(
      Math.cos(a) * b.radius,
      b.height + Math.sin(t * 0.7 + b.phase) * 0.18,
      Math.sin(a) * b.radius
    );
    b.group.rotation.y = -a + Math.PI / 2;
    b.group.rotation.z = Math.sin(t * 2.2 + b.phase) * 0.12;
  }
  if (lighthouse.userData.beamPivot) {
    lighthouse.userData.beamPivot.rotation.y = t * 0.45;
  }

  const ctx = {
    waterLevel,
    tide: params.tide,
    wave: params.wave,
    night: nightFactor,
    softness: params.softness,
  };

  for (const c of creatures) {
    if (c.update) c.update(t, dt, ctx);

    if (c.noSquish) {
      c.squishNode.scale.set(1, 1, 1);
      continue;
    }

    // 果冻回弹
    c.squishVel += (-c.squish * 150 - c.squishVel * 8.5) * dt;
    c.squish += c.squishVel * dt;
    const amp = 0.06 + params.softness * 0.30;
    const s = THREE.MathUtils.clamp(c.squish * amp, -0.34, 0.34);
    const idle = Math.sin(t * 2.2 + c.home.x) * (0.004 + params.softness * 0.014);
    const base = c.baseScale;
    c.squishNode.scale.set(
      base * (1 + s + idle),
      base * (1 - s * 0.55 - idle),
      base * (1 + s * 0.72 + idle)
    );
  }

  updateEnvironment(t, dt);
  updateGlow();

  // 相机聚焦（用世界坐标，岛身晃动时也能跟住）
  const target = new THREE.Vector3();
  if (focusCreature) {
    focusCreature.group.getWorldPosition(target);
    const crabFocusY = 1.25 + crabState.progress * 1.25;
    target.y += focusCreature.isShip ? 0.45
      : focusCreature.id === 'islandCrab' ? crabFocusY
      : 0.22;
  } else {
    target.copy(defaultTarget);
    target.y += smoothstep(0.22, 0.85, crabState.progress) * 1.15;
  }
  controls.target.lerp(target, 1 - Math.pow(0.001, dt));
  const zoom = focusCreature
    ? focusZoom
    : 1 - smoothstep(0.22, 0.85, crabState.progress) * 0.12;
  camera.zoom += (zoom - camera.zoom) * (1 - Math.pow(0.002, dt));
  camera.updateProjectionMatrix();
  controls.update();

  // 镜头震动：渲染前后临时偏移，不污染 OrbitControls 状态
  const shake = crabState.shake;
  const shakeX = Math.sin(t * 83) * 0.055 * shake;
  const shakeY = Math.cos(t * 71) * 0.045 * shake;
  camera.position.x += shakeX;
  camera.position.y += shakeY;
  renderer.render(scene, camera);
  camera.position.x -= shakeX;
  camera.position.y -= shakeY;

  if (firstFrame) {
    firstFrame = false;
    setTimeout(() => loader.classList.add('hide'), 250);
  }
}

/* ------------------------------------------------------------------ */
/* 尺寸                                                                 */
/* ------------------------------------------------------------------ */
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  fitCameraFrustum();
  const ty = aspect < 0.8 ? -3.2 : -0.45;
  defaultTarget.y = ty;
  if (!focusCreature) controls.target.y = ty;
});

// 让 URL 参数（night/tide）同步到 UI
ui.tide.value = String(Math.round(params.tide * 100));
ui.tideVal.textContent = String(Math.round(params.tide * 100));
ui.autoTide.checked = params.autoTide;
ui.day.value = String(Math.round(params.daylight * 100));
ui.dayVal.textContent = String(Math.round(params.daylight * 100));

// 聚焦参数：?focus=ship / crab / fish ... 便于验收
const focusId = qp.get('focus');
if (focusId) {
  const targetCreature = creatures.find((c) => c.id === focusId);
  if (targetCreature) setTimeout(() => focusOn(targetCreature), 120);
}
if (qp.has('cam')) {
  const mode = qp.get('cam');
  if (mode === 'low') {
    camera.position.set(14.5, 4.4, 17.5);
    controls.target.set(-0.4, -1.0, 0.4);
  } else if (mode === 'side') {
    camera.position.set(21, 2.0, 2.0);
    controls.target.set(0, -1.2, 0);
  } else if (mode === 'top') {
    camera.position.set(0.01, 26, 0.01);
    controls.target.set(0, -1.0, 0);
  }
  controls.update();
}
if (qp.has('wake')) {
  const wakeP = THREE.MathUtils.clamp(parseFloat(qp.get('wake')) || 0, 0, 1);
  crabState.awake = true;
  // wake=0.45 这类中间值用于截图验收：冻结在该进度
  crabState.target = wakeP < 0.995 ? wakeP : 1;
  crabState.progress = wakeP;
  crabState.pollution = smoothstep(0.02, 0.52, wakeP);
  crabState.pollutionTarget = crabState.pollution;
  crabState.debrisBudget = 64;
  ui.wake.classList.add('awake');
  ui.wake.textContent = '让岛蟹沉睡 · let it sleep';
}

// 调试入口
window.__jelly = {
  scene, camera, renderer, controls, params, creatures, waterUniforms,
  seaSim, heightTex, sampleSeaHeight, addDrop, terrainHeight, groundAtLocal, shoreRadius,
  focusOn, clearFocus, spawnRipple, waterHit, pier, pierDebris, crabState, mountainGroup,
  setDaylight: (v) => { params.daylight = v; ui.day.value = String(Math.round(v * 100)); ui.dayVal.textContent = String(Math.round(v * 100)); },
  setTide: (v) => { params.autoTide = false; ui.autoTide.checked = false; params.tide = v; ui.tide.value = String(Math.round(v * 100)); ui.tideVal.textContent = String(Math.round(v * 100)); },
};

animate();
</script>
