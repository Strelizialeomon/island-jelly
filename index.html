<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidepool Jelly · 果冻海屿</title>
<style>
  :root{
    --ink:#2b2620;
    --ink-soft:#7d7366;
    --paper:#f3ede2;
    --panel:rgba(250,246,238,.74);
    --line:rgba(43,38,32,.14);
    --accent:#1f8f83;
    --serif:"Iowan Old Style","Palatino Linotype","Songti SC","Noto Serif SC",serif;
    --sans:"Helvetica Neue","PingFang SC","Hiragino Sans GB",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    color:var(--ink);
    font-family:var(--sans);
    background:radial-gradient(120% 85% at 50% 18%, #fcf8ef 0%, #f2ebdd 52%, #e6dbc6 100%);
    transition:background .8s ease,color .8s ease;
  }
  body.night{
    --ink:#f3ecdc;
    --ink-soft:#a8a291;
    --paper:#101726;
    --panel:rgba(17,24,39,.72);
    --line:rgba(243,236,220,.16);
    background:radial-gradient(120% 85% at 50% 16%, #1c2639 0%, #101726 55%, #080d16 100%);
  }
  #scene{position:fixed;inset:0;display:block;width:100%;height:100%}
  #vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%, transparent 55%, rgba(64,48,28,.13) 100%);
    transition:background .8s ease;
  }
  body.night #vignette{background:radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(0,0,0,.42) 100%)}

  #masthead{position:fixed;left:42px;top:34px;pointer-events:none;max-width:46vw}
  #masthead h1{
    margin:0;font-family:var(--serif);font-weight:400;
    font-size:clamp(28px,3.4vw,46px);line-height:.98;letter-spacing:-.015em;
  }
  #masthead p{
    margin:10px 0 0;font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;
    color:var(--ink-soft);
  }
  #masthead .rule{width:52px;height:1px;background:var(--line);margin-top:16px;transition:background .8s}

  #hint{
    position:fixed;left:50%;transform:translateX(-50%);bottom:30px;
    font-size:11px;letter-spacing:.08em;color:var(--ink-soft);
    transition:opacity .6s ease,color .8s;white-space:nowrap;
  }

  #panel{
    position:fixed;right:26px;top:50%;transform:translateY(-50%);
    width:252px;max-height:88vh;overflow:auto;
    padding:17px 18px 14px;border:1px solid var(--line);border-radius:18px;
    background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 18px 50px rgba(48,36,20,.10);
    transition:background .8s,border-color .8s,box-shadow .8s;
    scrollbar-width:none;
  }
  #panel::-webkit-scrollbar{display:none}
  .panel-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
  .panel-head span{font-size:9.5px;letter-spacing:.26em;color:var(--ink-soft)}
  .panel-head b{font-family:var(--serif);font-weight:400;font-size:13px;font-style:italic;color:var(--ink-soft)}
  .group{margin:11px 0 13px}
  .group .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .group label{font-size:11px;letter-spacing:.07em;color:var(--ink)}
  .group .val{font-size:10px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;display:block;
  }
  input[type=range]::-webkit-slider-runnable-track{height:1.5px;background:var(--line);border-radius:2px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--ink);
    margin-top:-4.75px;box-shadow:0 0 0 3px var(--paper);
    transition:transform .15s ease;
  }
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
  input[type=range]::-moz-range-track{height:1.5px;background:var(--line)}
  input[type=range]::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:50%;background:var(--ink)}

  .check{display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--ink-soft);margin-top:5px;cursor:pointer;user-select:none}
  .check input{accent-color:var(--ink);width:11px;height:11px;margin:0}

  .pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
  .pill{
    font:inherit;font-size:10px;letter-spacing:.04em;color:var(--ink-soft);
    border:1px solid var(--line);background:transparent;border-radius:999px;
    padding:4.5px 8px;cursor:pointer;transition:all .2s ease;
  }
  .pill:hover{border-color:var(--ink-soft);color:var(--ink)}
  .pill.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  .pill .dot{display:inline-block;width:5px;height:5px;border-radius:50%;margin-right:5px;vertical-align:1px;opacity:.9}

  .actions{display:flex;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .actions button{
    font:inherit;font-size:10.5px;letter-spacing:.06em;color:var(--ink-soft);
    background:none;border:0;padding:0;cursor:pointer;border-bottom:1px solid transparent;
  }
  .actions button:hover{color:var(--ink);border-bottom-color:var(--line)}

  #wake{
    width:100%;margin-top:13px;padding:9px 12px;border:1px solid rgba(176,78,50,.34);
    border-radius:10px;background:rgba(208,104,70,.10);color:#9a4529;
    font:inherit;font-size:10px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer;
    transition:all .35s ease;
  }
  #wake:hover{background:rgba(208,104,70,.18);border-color:rgba(176,78,50,.6)}
  #wake.awake{background:rgba(176,78,50,.9);color:#fff3e4;border-color:transparent}
  body.night #wake{color:#e8b39b;border-color:rgba(232,179,155,.24);background:rgba(140,60,40,.16)}
  body.night #wake.awake{color:#1a120e;background:#e8b39b;border-color:transparent}

  #card{
    position:fixed;left:42px;bottom:64px;width:292px;max-width:calc(100vw - 84px);
    padding:17px 19px 16px;border:1px solid var(--line);border-radius:16px;
    background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 20px 50px rgba(48,36,20,.12);
    opacity:0;transform:translateY(10px);pointer-events:none;
    transition:opacity .35s ease,transform .35s ease,background .8s,border-color .8s;
  }
  #card.show{opacity:1;transform:translateY(0);pointer-events:auto}
  #card .idx{font-size:9px;letter-spacing:.24em;color:var(--ink-soft);text-transform:uppercase}
  #card h2{margin:7px 0 0;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.05}
  #card .en{margin-top:2px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  #card .fact{margin:12px 0 0;font-size:12px;line-height:1.65;color:var(--ink)}
  #card .close{
    position:absolute;right:12px;top:9px;width:24px;height:24px;border:0;background:none;
    color:var(--ink-soft);font-size:17px;line-height:1;cursor:pointer;
  }
  #card .close:hover{color:var(--ink)}

  #loader{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-style:italic;font-size:15px;letter-spacing:.06em;color:var(--ink-soft);
    background:var(--paper);transition:opacity .9s ease;z-index:20;
  }
  #loader.hide{opacity:0;pointer-events:none}

  #error{
    display:none;position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:30;
    max-width:80vw;padding:10px 14px;border-radius:10px;background:#b3352c;color:#fff;
    font-size:11px;line-height:1.5;white-space:pre-wrap;
  }

  @media (max-width: 820px){
    #masthead{left:22px;top:20px}
    #hint{display:none}
    #panel{
      right:14px;left:14px;top:auto;bottom:14px;transform:none;width:auto;max-height:42vh;
      border-radius:16px;
    }
    #card{left:22px;bottom:calc(42vh + 32px);width:calc(100vw - 44px)}
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="vignette"></div>

<header id="masthead">
  <h1>Tidepool Jelly</h1>
  <p>果冻海屿 · a soft littoral study</p>
  <div class="rule"></div>
</header>

<div id="hint">拖动方块里的水面制造涟漪 · 拖动岛屿旋转 · 滚轮缩放 · 点击生物</div>

<aside id="panel">
  <div class="panel-head"><span>CONTROLS</span><b>tide &amp; touch</b></div>

  <div class="group">
    <div class="row"><label>潮汐高度</label><span class="val" id="v-tide">55</span></div>
    <input type="range" id="s-tide" min="0" max="100" value="55">
    <label class="check"><input type="checkbox" id="auto-tide" checked>自动潮汐循环</label>
  </div>

  <div class="group">
    <div class="row"><label>海浪强度</label><span class="val" id="v-wave">55</span></div>
    <input type="range" id="s-wave" min="0" max="100" value="55">
  </div>

  <div class="group">
    <div class="row"><label>水体清澈度</label><span class="val" id="v-clarity">62</span></div>
    <input type="range" id="s-clarity" min="0" max="100" value="62">
  </div>

  <div class="group">
    <div class="row"><label>果冻柔软度</label><span class="val" id="v-soft">66</span></div>
    <input type="range" id="s-soft" min="0" max="100" value="66">
  </div>

  <div class="group">
    <div class="row"><label>昼夜光照</label><span class="val" id="v-day">88</span></div>
    <input type="range" id="s-day" min="0" max="100" value="88">
  </div>

  <div class="group">
    <div class="row"><label>物种</label><span class="val">tap to toggle</span></div>
    <div class="pills" id="pills"></div>
  </div>

  <div class="actions">
    <button id="btn-pause">暂停</button>
    <button id="btn-reset">重置</button>
    <button id="btn-rand">随机生态</button>
  </div>

  <button id="wake">唤醒岛蟹 · wake the island</button>
</aside>

<section id="card" aria-hidden="true">
  <button class="close" id="card-close" aria-label="关闭">×</button>
  <div class="idx" id="card-idx">No. 01 · jelly species</div>
  <h2 id="card-name">小蟹</h2>
  <div class="en" id="card-en">Crab</div>
  <p class="fact" id="card-fact"></p>
</section>

<div id="loader">settling the jelly…</div>
<div id="error"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------ */
/* 基础常量                                                             */
/* ------------------------------------------------------------------ */
const BLOCK_SIZE = 16.5;        // 方形海水块边长
const BLOCK_HALF = BLOCK_SIZE / 2;
const BLOCK_RADIUS = 0.9;       // 方块圆角
const BLOCK_BOTTOM = -4.0;      // 含水土层的方块底
const SEA_SIZE = BLOCK_SIZE;    // 水面高度场范围 = 方块
const SEA_GRID = 160;           // 水面高度场分辨率
const SEA_HEIGHT_SCALE = 1.0;   // 高度场 -> 世界高度
const SEA_BASE = 0;             // 基准海平面
const TIDE_AMPLITUDE = 0.06;    // 潮汐让水面上下移动的总幅度
const FRUSTUM_H = 20.5;
const FRUSTUM_W = 25.5;

// 岛放在画面右后角；海床朝左前角（远角）下降
const ISLAND_C = { x: 3.0, z: -3.0 };
const SLOPE_DIR = { x: -Math.SQRT1_2, z: Math.SQRT1_2 };
// 山体（会跟着蟹背升起）在岛局部坐标里的中心与半径
const MOUNTAIN_C = { x: -0.7, z: -0.6 };
const MOUNTAIN_R = 2.75;
// 螃蟹藏在山体下面；身体略向前，让眼柄/螯/前腿露在山体前缘外
const CRAB_FORWARD = 1.15;
const CRAB_HIDDEN_Y = -1.0;
const CRAB_STAND_RISE = 2.45;
const CRAB_CAP_SEAT = 0.35;

const params = {
  tide: 0.55,
  autoTide: true,
  wave: 0.55,
  clarity: 0.62,
  softness: 0.66,
  daylight: 0.88,
  paused: false,
};

// 岛蟹状态：岛本身是一只睡着的巨蟹
const crabState = {
  awake: false,
  progress: 0,
  target: 0,
  pollution: 0,
  pollutionTarget: 0,
  debrisBudget: 0,
  debrisTimer: 0,
  shake: 0,
  emerging: false,
  pierDestroyed: false,
};

const qp = new URLSearchParams(location.search);
if (qp.get('night') === '1') params.daylight = 0.06;
if (qp.has('tide')) { params.tide = THREE.MathUtils.clamp(parseFloat(qp.get('tide')), 0, 1); params.autoTide = false; }

const errorEl = document.getElementById('error');
function showError(msg) {
  errorEl.textContent = String(msg);
  errorEl.style.display = 'block';
}
window.addEventListener('error', (e) => showError('JS · ' + e.message));
window.addEventListener('unhandledrejection', (e) => showError('Promise · ' + (e.reason?.message || e.reason)));

/* ------------------------------------------------------------------ */
/* 渲染器 / 相机 / 灯光                                                  */
/* ------------------------------------------------------------------ */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.8));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const islandGroup = new THREE.Group();
islandGroup.name = 'islandGroup';
scene.add(islandGroup);

let aspect = window.innerWidth / window.innerHeight;
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 220);
function fitCameraFrustum() {
  aspect = window.innerWidth / window.innerHeight;
  // 竖屏时按宽度兜底，保证整座岛不会被裁掉
  const h = Math.max(FRUSTUM_H, FRUSTUM_W / aspect);
  camera.top = h / 2;
  camera.bottom = -h / 2;
  camera.left = -h * aspect / 2;
  camera.right = h * aspect / 2;
  camera.updateProjectionMatrix();
}
fitCameraFrustum();
const START_TARGET_Y = aspect < 0.8 ? -3.2 : -0.45;
camera.position.set(15.8, 8.8, 18.8);
camera.lookAt(-0.25, START_TARGET_Y, 0.25);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.25, START_TARGET_Y, 0.25);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.enablePan = false;
controls.minZoom = 0.72;
controls.maxZoom = 3.6;
controls.minPolarAngle = 0.52;
controls.maxPolarAngle = 1.24;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.8;

const hemi = new THREE.HemisphereLight(0xfff6e6, 0xb9a88c, 1.15);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff1d4, 2.7);
sun.position.set(7.5, 13, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -10;
sun.shadow.camera.right = 10;
sun.shadow.camera.top = 10;
sun.shadow.camera.bottom = -10;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 40;
sun.shadow.bias = -0.0006;
scene.add(sun);

const fill = new THREE.DirectionalLight(0xbfe6ff, 0.55);
fill.position.set(-8, 5, -7);
scene.add(fill);

// 环境反射：一张很小的暖色渐变，让果冻有高光
function makeEnvTexture() {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 32;
  const g = c.getContext('2d');
  const grad = g.createLinearGradient(0, 0, 0, 32);
  grad.addColorStop(0, '#fff9ea');
  grad.addColorStop(0.52, '#f3e4c9');
  grad.addColorStop(1, '#c9b494');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 32);
  const tex = new THREE.CanvasTexture(c);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromEquirectangular(makeEnvTexture()).texture;
scene.environmentIntensity = 0.62;

/* ------------------------------------------------------------------ */
/* 工具函数                                                             */
/* ------------------------------------------------------------------ */
function smoothstep(a, b, x) {
  const t = THREE.MathUtils.clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

// 不规则海岸线（岛心局部坐标）
function shoreRadius(theta) {
  return 4.30
    + 0.46 * Math.sin(theta * 3 + 1.15)
    + 0.28 * Math.sin(theta * 5 - 0.45)
    + 0.18 * Math.sin(theta * 7 + 2.10);
}

// 岛丘本身：岸线处为 0，往内抬升
function islandMound(lx, lz) {
  const r = Math.hypot(lx, lz);
  const theta = Math.atan2(lz, lx);
  const R = shoreRadius(theta);
  if (r >= R) return 0;
  const t = Math.min(1, r / R);
  const cliff = Math.pow(Math.max(0, Math.sin(theta + 2.35)), 3);
  const profile = 1.75 - cliff * 0.95;
  const peak = 1.75 + 0.35 * Math.sin(theta * 2 + 0.5) + 0.15 * Math.sin(theta * 4 - 1.1);
  let h = peak * Math.pow(1 - t, profile);
  h += 0.55 * Math.exp(-(((lx + 1.3) ** 2 + (lz + 0.7) ** 2) / 4.0)) * Math.pow(1 - t, 0.7);
  h += 0.28 * Math.exp(-(((lx - 1.2) ** 2 + (lz + 1.6) ** 2) / 3.0)) * (1 - t);
  h += 0.045 * Math.sin(lx * 2.3 + lz * 1.7) * (1 - t);
  return Math.max(0, h);
}

// 海床：岛岸外一路往左前角下降；方向偏置 + S 曲线坡折 + 噪声
function seabedY(x, z) {
  const dx = x - ISLAND_C.x;
  const dz = z - ISLAND_C.z;
  const r = Math.hypot(dx, dz);
  const inv = 1 / Math.max(r, 0.001);
  const dirDot = (dx * SLOPE_DIR.x + dz * SLOPE_DIR.z) * inv;
  const directional = 0.52 + 0.48 * smoothstep(-0.65, 1.0, dirDot);
  const s = THREE.MathUtils.clamp((r - 3.6) / 10.4, 0, 1) * directional;
  let depth = 0.14 + 3.35 * smoothstep(0.0, 1.0, s);
  depth += 0.16 * Math.exp(-Math.pow((s - 0.62) / 0.11, 2)); // 坡折
  depth += 0.085 * Math.sin(dx * 0.52 + dz * 0.37 + 1.3)
         + 0.045 * Math.sin(dx * 1.15 - dz * 0.83 - 0.6);
  return -depth;
}

// 未被挖坑前的岛面高度 = 海床 + 岛丘
function islandSurfaceHeight(x, z) {
  return seabedY(x, z) + islandMound(x - ISLAND_C.x, z - ISLAND_C.z);
}

// 山体盖子的边界（岛局部角度）
function mountainRadiusAt(theta) {
  return MOUNTAIN_R * (
    0.94
    + 0.050 * Math.sin(theta * 3 + 0.80)
    + 0.035 * Math.sin(theta * 5 - 1.20)
  );
}

// 山体下方挖出的坑：中心最深，到边缘回到原岛面
function craterDepthAt(x, z) {
  const mx = x - (ISLAND_C.x + MOUNTAIN_C.x);
  const mz = z - (ISLAND_C.z + MOUNTAIN_C.z);
  const mr = Math.hypot(mx, mz);
  if (mr > MOUNTAIN_R * 1.2) return 0;
  const rim = mountainRadiusAt(Math.atan2(mz, mx));
  const t = 1 - smoothstep(0, rim, mr);
  return 1.15 * t * t;
}

// 世界坐标地形（已挖坑）= 岛面 - 坑深
function terrainHeight(x, z) {
  return islandSurfaceHeight(x, z) - craterDepthAt(x, z);
}

// 岛上的道具仍用局部坐标；取的是“原岛面”，所以山上的道具会正好落在盖子上
function groundAtLocal(lx, lz) {
  return islandSurfaceHeight(ISLAND_C.x + lx, ISLAND_C.z + lz);
}

function terrainSlope(x, z) {
  const e = 0.10;
  const h = terrainHeight(x, z);
  const hx = terrainHeight(x + e, z);
  const hz = terrainHeight(x, z + e);
  return Math.hypot(hx - h, hz - h) / e;
}

function surfaceSlope(x, z) {
  const e = 0.10;
  const h = islandSurfaceHeight(x, z);
  const hx = islandSurfaceHeight(x + e, z);
  const hz = islandSurfaceHeight(x, z + e);
  return Math.hypot(hx - h, hz - h) / e;
}

function blockSDF(x, z, inset = 0) {
  const b = BLOCK_HALF - inset;
  const r = BLOCK_RADIUS - inset;
  const qx = Math.abs(x) - b + r;
  const qz = Math.abs(z) - b + r;
  return Math.hypot(Math.max(qx, 0), Math.max(qz, 0)) + Math.min(Math.max(qx, qz), 0) - r;
}

const blockRadiusCache = [];
function blockRadiusAt(theta) {
  const turn = Math.PI * 2;
  const a = ((theta % turn) + turn) % turn;
  const idx = Math.round((a / turn) * 1024) % 1024;
  if (blockRadiusCache[idx] !== undefined) return blockRadiusCache[idx];
  const dx = Math.cos(theta), dz = Math.sin(theta);
  let lo = 0, hi = BLOCK_HALF * 1.5;
  for (let i = 0; i < 28; i++) {
    const mid = (lo + hi) * 0.5;
    if (blockSDF(dx * mid, dz * mid) <= 0) lo = mid; else hi = mid;
  }
  blockRadiusCache[idx] = lo;
  return lo;
}

const COL_SAND = new THREE.Color(0xe6cfa0);
const COL_SAND_WET = new THREE.Color(0xc2a678);
const COL_SAND_UNDER = new THREE.Color(0xd2c39e);
const COL_GRASS = new THREE.Color(0x7d9d5f);
const COL_GRASS_DARK = new THREE.Color(0x5b7c48);
const COL_ROCK = new THREE.Color(0x8a8276);
const COL_ROCK_DARK = new THREE.Color(0x686157);
const COL_SILT = new THREE.Color(0x7d8574);
const COL_DEEP = new THREE.Color(0x3e5b58);

function surfaceColorAt(x, z, h, slope, out) {
  const n = 0.5 + 0.5 * Math.sin(x * 1.7 + z * 2.1) * Math.sin(x * 0.7 - z * 1.3);
  if (h < -0.03) {
    const d = -h;
    if (d < 0.5) out.copy(COL_SAND_WET).lerp(COL_SAND_UNDER, smoothstep(0.0, 0.5, d));
    else if (d < 1.4) out.copy(COL_SAND_UNDER).lerp(COL_SILT, smoothstep(0.5, 1.4, d));
    else if (d < 2.6) out.copy(COL_SILT).lerp(COL_DEEP, smoothstep(1.4, 2.6, d));
    else out.copy(COL_DEEP).lerp(COL_ROCK_DARK, 0.25);
    out.offsetHSL((n - 0.5) * 0.02, (n - 0.5) * 0.05, (n - 0.5) * 0.05);
  } else if (h < 0.16) {
    out.copy(COL_SAND_WET).lerp(COL_SAND, smoothstep(0.0, 0.16, h));
  } else if (slope > 0.9 && h > 0.25) {
    out.copy(COL_ROCK).lerp(COL_ROCK_DARK, n * 0.7);
  } else if (h < 0.36) {
    out.copy(COL_SAND).lerp(COL_GRASS, smoothstep(0.18, 0.36, h));
  } else {
    out.copy(COL_GRASS).lerp(COL_GRASS_DARK, n * 0.75);
    if (h > 1.25) out.lerp(COL_ROCK, smoothstep(1.25, 1.75, h) * 0.55);
  }
  out.offsetHSL((n - 0.5) * 0.015, 0, (n - 0.5) * 0.035);
}

const craterTmpA = new THREE.Color();
const craterTmpB = new THREE.Color();

// 地形网格用：坑内露出深色湿土/碎石，边缘过渡回草/沙
function terrainColorAt(x, z, h, slope, out) {
  const mx = x - (ISLAND_C.x + MOUNTAIN_C.x);
  const mz = z - (ISLAND_C.z + MOUNTAIN_C.z);
  const mr = Math.hypot(mx, mz);
  const rim = mountainRadiusAt(Math.atan2(mz, mx));
  if (mr < rim * 1.04) {
    const n = 0.5 + 0.5 * Math.sin(x * 3.1 + z * 2.7) * Math.sin(x * 1.3 - z * 1.9);
    const rimY = islandSurfaceHeight(x, z);
    const depth = Math.max(0, rimY - h);
    craterTmpA.setRGB(0.25, 0.18, 0.12).lerp(craterTmpB.setHex(0x6b6154), n * 0.72);
    craterTmpA.multiplyScalar(0.72 + 0.28 * Math.exp(-depth * 1.8));
    const blend = smoothstep(rim * 0.84, rim * 1.02, mr);
    if (blend > 0.001) {
      surfaceColorAt(x, z, h, slope, craterTmpB);
      craterTmpA.lerp(craterTmpB, blend);
    }
    out.copy(craterTmpA);
    return;
  }
  surfaceColorAt(x, z, h, slope, out);
}

function randomLandPoint(minH = 0.1, maxH = 1.2, maxR = 4.5) {
  for (let i = 0; i < 300; i++) {
    const a = Math.random() * Math.PI * 2;
    const rr = Math.sqrt(Math.random()) * maxR;
    const lx = Math.cos(a) * rr;
    const lz = Math.sin(a) * rr;
    const h = groundAtLocal(lx, lz);
    if (h > minH && h < maxH && rr < shoreRadius(a) - 0.18) return { x: lx, z: lz, h };
  }
  return { x: 0, z: 0, h: groundAtLocal(0, 0) };
}

const TERRAIN_RINGS = 112;
const TERRAIN_SEGS = 240;
const terrainGeo = new THREE.BufferGeometry();
const terrainPositions = [];
const terrainColors = [];
const terrainIndices = [];
const terrainTmpColor = new THREE.Color();
for (let i = 0; i <= TERRAIN_RINGS; i++) {
  const t = i / TERRAIN_RINGS;
  for (let j = 0; j <= TERRAIN_SEGS; j++) {
    const a = (j / TERRAIN_SEGS) * Math.PI * 2;
    const R = blockRadiusAt(a);
    const r = t * R;
    const x = Math.cos(a) * r;
    const z = Math.sin(a) * r;
    const h = terrainHeight(x, z);
    terrainPositions.push(x, h, z);
    terrainColorAt(x, z, h, terrainSlope(x, z), terrainTmpColor);
    terrainColors.push(terrainTmpColor.r, terrainTmpColor.g, terrainTmpColor.b);
  }
}
for (let i = 0; i < TERRAIN_RINGS; i++) {
  for (let j = 0; j < TERRAIN_SEGS; j++) {
    const a = i * (TERRAIN_SEGS + 1) + j;
    const b = a + 1;
    const c = a + (TERRAIN_SEGS + 1);
    const d = c + 1;
    terrainIndices.push(a, b, c, b, d, c);
  }
}
terrainGeo.setAttribute('position', new THREE.Float32BufferAttribute(terrainPositions, 3));
terrainGeo.setAttribute('color', new THREE.Float32BufferAttribute(terrainColors, 3));
terrainGeo.setIndex(terrainIndices);

const seaNearVert = /* glsl */`
  uniform float uTime;
  uniform float uWaveStrength;
  uniform float uHeightScale;
  uniform sampler2D uHeight;
  uniform vec2 uTexel;

  varying vec3 vWorldPos;
  varying vec3 vNormalW;
  varying vec2 vUv;
  varying float vHeight;

  float baseWave(vec2 p, float t) {
    return sin(p.x * 0.62 + t * 0.70) * 0.014
         + sin(p.y * 0.83 - t * 0.55) * 0.012
         + sin((p.x * 0.8 + p.y * 1.1) + t * 0.90) * 0.008
         + sin((p.x * 1.7 - p.y * 0.6) - t * 1.30) * 0.005;
  }

  void main() {
    vec2 uv0 = uv;
    float sim = texture2D(uHeight, uv0).r;
    float base = baseWave(position.xz, uTime);
    float h = sim * uHeightScale + base * uWaveStrength;

    vec3 pos = position;
    pos.y += h;

    float e = max(0.22, uTexel.x * 4.0);
    float simX = texture2D(uHeight, uv0 + vec2(uTexel.x, 0.0)).r;
    float simZ = texture2D(uHeight, uv0 + vec2(0.0, uTexel.y)).r;
    // 大尺度涌浪只做高度，不做强法线，避免出现大片明暗斑块
    float baseN = 0.10;
    float hX = simX * uHeightScale + baseWave(position.xz + vec2(e, 0.0), uTime) * uWaveStrength * baseN;
    float hZ = simZ * uHeightScale + baseWave(position.xz + vec2(0.0, e), uTime) * uWaveStrength * baseN;

    vNormalW = normalize(vec3(-(hX - h) / e, 1.0, -(hZ - h) / e));
    vUv = uv0;
    vHeight = h;

    vec4 wp = modelMatrix * vec4(pos, 1.0);
    vWorldPos = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const seaNearFrag = /* glsl */`
  uniform float uTime;
  uniform float uTide;
  uniform float uClarity;
  uniform float uNight;
  uniform float uPollution;
  uniform float uSeaSize;
  uniform float uBlockHalf;
  uniform float uBlockRadius;
  uniform float uBlockSize;
  uniform float uWaterLevel;
  uniform sampler2D uTerrain;
  uniform vec3 uDeep;
  uniform vec3 uMid;
  uniform vec3 uShallow;
  uniform vec3 uSky;
  uniform vec3 uHorizon;
  uniform vec3 uSun;
  uniform vec3 uLightDir;

  varying vec3 vWorldPos;
  varying vec3 vNormalW;
  varying vec2 vUv;
  varying float vHeight;

  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float noise2(vec2 p) {
    vec2 i = floor(p);
    vec2 f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
  }
  float sdRoundBox(vec2 p, vec2 b, float r) {
    vec2 q = abs(p) - b + r;
    return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
  }

  void main() {
    vec2 p = vWorldPos.xz;
    float bd = sdRoundBox(p, vec2(uBlockHalf), uBlockRadius);
    if (bd > 0.0) discard;
    float blockEdge = smoothstep(0.0, -0.03, bd);

    // 地形高度图：水深决定颜色/透明度，岸线决定泡沫
    vec2 tuv = p / uBlockSize + 0.5;
    float groundY = texture2D(uTerrain, tuv).r;
    float depth = max(0.0, uWaterLevel - groundY);
    float land = 1.0 - smoothstep(uWaterLevel - 0.03, uWaterLevel + 0.02, groundY);
    if (land < 0.01) discard;

    // CPU 高度场给大涟漪，这里补两层细碎表面
    vec3 detail = vec3(
      sin(p.x * 2.6 + uTime * 1.4) * 0.050
        + sin(p.y * 3.4 - uTime * 1.1 + p.x * 0.9) * 0.028,
      0.0,
      cos(p.y * 2.9 - uTime * 1.2) * 0.050
        + cos(p.x * 3.8 + uTime * 0.9 + p.y * 0.7) * 0.026
    );
    float fine = sin(p.x * 7.5 + p.y * 5.5 - uTime * 2.3) * 0.012
               + sin(p.x * 9.0 - p.y * 7.0 + uTime * 2.0) * 0.008;
    detail.x += fine;
    detail.z += fine * 0.8;
    // 一点不规则噪声，打散正弦纹理的呆板感
    float nA = noise2(p * 3.1 + vec2(uTime * 0.22, -uTime * 0.16));
    float nB = noise2(p * 3.1 + vec2(7.1, 2.3) + vec2(-uTime * 0.18, uTime * 0.20));
    detail.x += (nA - 0.5) * 0.055;
    detail.z += (nB - 0.5) * 0.055;
    vec3 N = normalize(vNormalW + detail);

    vec3 V = normalize(cameraPosition - vWorldPos);
    float ndv = max(dot(N, V), 0.0);
    float F = 0.02 + 0.98 * pow(1.0 - ndv, 5.0);

    vec3 R = reflect(-V, N);
    vec3 skyRef = mix(uHorizon, uSky, smoothstep(-0.02, 0.7, R.y));
    vec3 L = normalize(uLightDir);
    float sunGlow = pow(max(dot(R, L), 0.0), 220.0);
    skyRef += uSun * sunGlow * 0.9;
    skyRef += uSun * pow(max(dot(R, L), 0.0), 22.0) * 0.16;
    skyRef += vec3(0.10, 0.14, 0.12) * pow(1.0 - abs(R.y), 6.0) * 0.25;

    float dt = smoothstep(0.0, 2.9, depth);
    vec3 col = mix(uShallow, uMid, smoothstep(0.0, 0.55, depth));
    col = mix(col, uDeep, smoothstep(0.55, 2.6, depth));
    col = mix(col, skyRef, clamp(F * 0.68 + 0.04, 0.0, 0.84));

    vec3 H = normalize(L + V);
    float spec = pow(max(dot(N, H), 0.0), 260.0) * 2.4
               + pow(max(dot(N, H), 0.0), 30.0) * 0.08
               + pow(max(dot(N, H), 0.0), 12.0) * 0.06;
    col += uSun * spec;

    // 岸线细泡沫 + 浪峰白沫
    float shoreBand = 1.0 - smoothstep(0.02, 0.24, depth);
    float foamNoise = noise2(p * 8.5 + vec2(uTime * 0.18, -uTime * 0.12));
    float foam = shoreBand * smoothstep(0.56, 0.82, foamNoise) * 0.70;
    float crest = smoothstep(0.055, 0.12, vHeight);
    foam += crest * smoothstep(0.40, 0.80, noise2(p * 11.0 + uTime * 0.25)) * 0.38;
    foam = clamp(foam, 0.0, 1.0);
    vec3 foamCol = mix(vec3(1.0, 0.99, 0.95), vec3(0.58, 0.55, 0.40), uPollution * 0.6);
    col = mix(col, foamCol, foam * 0.38);

    float alpha = mix(0.09, 0.40, dt);
    alpha = mix(alpha, 0.82, F * 0.60);
    alpha *= 1.0 - uClarity * 0.20;
    alpha = mix(alpha, 0.92, foam * 0.40);

    // 污染：褐绿的膜、悬浮颗粒、脏泡沫
    vec3 murky = mix(vec3(0.30, 0.27, 0.17), vec3(0.10, 0.12, 0.08), uNight);
    float film = smoothstep(0.55, 0.85, 0.5 + 0.5 * sin(p.x * 0.38 + sin(p.y * 0.27) * 1.7 + uTime * 0.04));
    col = mix(col, murky, uPollution * (0.55 + film * 0.12));
    col += vec3(0.10, 0.09, 0.05) * step(0.90, hash21(floor(p * 52.0) + floor(uTime * 0.4))) * uPollution * 0.4;
    alpha = mix(alpha, min(1.0, alpha + 0.16), uPollution);

    // 夜间微光
    col *= mix(1.0, 0.62, uNight);
    float sparkle = step(0.982, hash21(floor(p * 44.0) + floor(uTime * 0.7)));
    col += vec3(0.40, 1.0, 0.80) * sparkle * uNight * 0.35 * (1.0 - uPollution * 0.7);

    // 方块边缘的一圈清水高光
    float blockFoam = smoothstep(-0.13, 0.0, bd);
    col = mix(col, vec3(0.88, 0.99, 0.97), blockFoam * 0.06);

    gl_FragColor = vec4(col, alpha * blockEdge * land);
  }
`;

const seaFarVert = /* glsl */`
  varying vec3 vWorldPos;
  void main() {
    vec4 wp = modelMatrix * vec4(position, 1.0);
    vWorldPos = wp.xyz;
    gl_Position = projectionMatrix * viewMatrix * wp;
  }
`;

const seaFarFrag = /* glsl */`
  uniform float uTime;
  uniform float uWaveStrength;
  uniform float uNight;
  uniform float uPollution;
  uniform vec3 uDeep;
  uniform vec3 uMid;
  uniform vec3 uShallow;
  uniform vec3 uSky;
  uniform vec3 uSun;
  uniform vec3 uLightDir;

  varying vec3 vWorldPos;

  float hash(vec2 p) {
    return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453);
  }
  float sdRoundBox(vec2 p, vec2 b, float r) {
    vec2 q = abs(p) - b + r;
    return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r;
  }
  float shoreR(float a) {
    return 5.05 + 0.52 * sin(a * 3.0 + 1.15)
         + 0.32 * sin(a * 5.0 - 0.45)
         + 0.22 * sin(a * 7.0 + 2.10);
  }

  void main() {
    vec2 p = vWorldPos.xz;
    float r = length(p);
    float a = atan(p.y, p.x);
    float d = r - shoreR(a);

    float nx = sin(p.x * 0.36 + uTime * 0.42) * 0.075
             + sin((p.x + p.y) * 0.22 - uTime * 0.30) * 0.045;
    float nz = cos(p.y * 0.44 - uTime * 0.36) * 0.075
             + cos((p.x - p.y) * 0.20 + uTime * 0.26) * 0.045;
    vec3 N = normalize(vec3(nx * uWaveStrength, 1.0, nz * uWaveStrength));
    vec3 V = normalize(cameraPosition - vWorldPos);

    vec3 col = mix(uShallow, uMid, smoothstep(0.0, 14.0, d));
    col = mix(col, uDeep, smoothstep(12.0, 52.0, d));

    float fres = pow(1.0 - max(dot(N, V), 0.0), 3.0);
    col = mix(col, uSky, fres * 0.45 + smoothstep(34.0, 92.0, r) * 0.62);

    vec3 L = normalize(uLightDir);
    vec3 Rf = reflect(-L, N);
    float spec = pow(max(dot(Rf, V), 0.0), 90.0);
    col += uSun * spec * 0.9;

    float lines = 0.5 + 0.5 * sin(p.x * 0.55 + p.y * 0.28 + uTime * 0.55 + sin(p.y * 0.8) * 1.4);
    col += vec3(0.015, 0.025, 0.025) * smoothstep(0.78, 1.0, lines) * (1.0 - smoothstep(20.0, 60.0, r));

    vec3 murky = mix(vec3(0.30, 0.27, 0.17), vec3(0.09, 0.12, 0.07), uNight);
    col = mix(col, murky, uPollution * 0.58);
    col += vec3(0.10, 0.09, 0.045) * step(0.93, hash(floor(p * 30.0))) * uPollution;

    gl_FragColor = vec4(col, 1.0);
  }
`;

function appendRoundedRect(path, size, radius) {
  const x = -size / 2, y = -size / 2;
  path.moveTo(x + radius, y);
  path.lineTo(x + size - radius, y);
  path.quadraticCurveTo(x + size, y, x + size, y + radius);
  path.lineTo(x + size, y + size - radius);
  path.quadraticCurveTo(x + size, y + size, x + size - radius, y + size);
  path.lineTo(x + radius, y + size);
  path.quadraticCurveTo(x, y + size, x, y + size - radius);
  path.lineTo(x, y + radius);
  path.quadraticCurveTo(x, y, x + radius, y);
  return path;
}
function roundedRectShape(size, radius) {
  const s = new THREE.Shape();
  appendRoundedRect(s, size, radius);
  return s;
}
function roundedRectPath(size, radius) {
  const p = new THREE.Path();
  appendRoundedRect(p, size, radius);
  return p;
}
function makeSoftShadowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128, 128, 8, 128, 128, 122);
  grad.addColorStop(0, 'rgba(66,50,30,0.30)');
  grad.addColorStop(0.55, 'rgba(66,50,30,0.14)');
  grad.addColorStop(1, 'rgba(66,50,30,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ------------------------------------------------------------------ */
/* 方块切面：土壤分层侧壁 + 水柱侧壁 + 底盖 + 海床焦散                     */
/* ------------------------------------------------------------------ */
const WALL_SEGS = 320;

function blockNormalAt(x, z) {
  const e = 0.012;
  const nx = blockSDF(x + e, z) - blockSDF(x - e, z);
  const nz = blockSDF(x, z + e) - blockSDF(x, z - e);
  const len = Math.hypot(nx, nz) || 1;
  return { x: nx / len, z: nz / len };
}

const wallPerimeter = [];
for (let j = 0; j <= WALL_SEGS; j++) {
  const a = (j / WALL_SEGS) * Math.PI * 2;
  const R = blockRadiusAt(a);
  const x = Math.cos(a) * R;
  const z = Math.sin(a) * R;
  wallPerimeter.push({ a, x, z, n: blockNormalAt(x, z) });
}

function buildCurtain(inset, rows, topAt, bottomAt) {
  const pos = [];
  const norm = [];
  const idx = [];
  const terrainY = [];
  const column = [];
  for (let j = 0; j <= WALL_SEGS; j++) {
    const a = (j / WALL_SEGS) * Math.PI * 2;
    const R = blockRadiusAt(a) - inset;
    const x = Math.cos(a) * R;
    const z = Math.sin(a) * R;
    const n = blockNormalAt(x, z);
    const top = topAt(x, z);
    const bottom = bottomAt(x, z);
    const col = Math.max(0.02, 0.0 - bottom);
    for (let i = 0; i <= rows; i++) {
      const t = i / rows;
      const y = top + (bottom - top) * t;
      pos.push(x, y, z);
      norm.push(n.x, 0, n.z);
      terrainY.push(top);
      column.push(col);
    }
  }
  for (let j = 0; j < WALL_SEGS; j++) {
    for (let i = 0; i < rows; i++) {
      const a = j * (rows + 1) + i;
      const b = a + 1;
      const c = (j + 1) * (rows + 1) + i;
      const d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(norm, 3));
  geo.setAttribute('aTerrainY', new THREE.Float32BufferAttribute(terrainY, 1));
  geo.setAttribute('aColumn', new THREE.Float32BufferAttribute(column, 1));
  geo.setIndex(idx);
  return geo;
}

/* 土层侧壁：分层跟着地形走，边界用噪声弄弯，深水端自然尖灭 */
const soilWallGeo = buildCurtain(
  0.012,
  10,
  (x, z) => terrainHeight(x, z) + 0.03,
  () => BLOCK_BOTTOM
);
const soilWallUniforms = {
  uSunDir: { value: new THREE.Vector3(7.5, 13, 9).normalize() },
  uNight: { value: 0 },
};
const soilWallMat = new THREE.ShaderMaterial({
  uniforms: soilWallUniforms,
  vertexShader: /* glsl */`
    attribute float aTerrainY;
    varying vec3 vWorldPos;
    varying vec3 vNormalW;
    varying float vTerrainY;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      vTerrainY = aTerrainY;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 uSunDir;
    uniform float uNight;
    varying vec3 vWorldPos;
    varying vec3 vNormalW;
    varying float vTerrainY;

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float noise2(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    float fbm(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 4; i++) {
        v += a * noise2(p);
        p = p * 2.03 + 11.7;
        a *= 0.5;
      }
      return v;
    }

    void main() {
      float d = vTerrainY - vWorldPos.y;
      vec2 q = vWorldPos.xz;
      float warp = (fbm(q * 0.42 + 3.2) - 0.5) * 0.62
                 + (fbm(q * 1.35 - 7.1) - 0.5) * 0.20;
      float m = fbm(q * 0.22 + 11.0);
      float dip = q.x * 0.045 - q.y * 0.030;
      float dd = d + warp + (m - 0.5) * 0.38 + dip;

      vec3 humus = vec3(0.21, 0.15, 0.10);
      vec3 topsoil = vec3(0.38, 0.255, 0.165);
      vec3 clay = mix(vec3(0.56, 0.37, 0.24), vec3(0.66, 0.45, 0.30), fbm(q * 1.1 + 4.0));
      vec3 regolith = mix(vec3(0.70, 0.60, 0.46), vec3(0.56, 0.49, 0.40), fbm(q * 1.6 + 8.0));
      vec3 rock = mix(vec3(0.46, 0.44, 0.41), vec3(0.34, 0.33, 0.31), fbm(q * 0.8 - 2.0));

      vec3 col = humus;
      col = mix(col, topsoil, smoothstep(0.08, 0.17, dd));
      // E 层：被淋洗过的浅色层，夹在表土和黏土之间
      float eHorizon = smoothstep(0.19, 0.24, dd) * (1.0 - smoothstep(0.31, 0.37, dd));
      col = mix(col, vec3(0.62, 0.56, 0.46), eHorizon * 0.65);
      col = mix(col, clay, smoothstep(0.40, 0.53, dd));
      // 黏土层里夹一条浅色砂层
      float sandSeam = smoothstep(0.80, 0.86, dd) * (1.0 - smoothstep(0.94, 1.00, dd));
      col = mix(col, vec3(0.78, 0.70, 0.55), sandSeam * 0.50);
      col = mix(col, regolith, smoothstep(0.94, 1.09, dd));
      col = mix(col, rock, smoothstep(1.68, 1.85, dd));
      // 砂层里再夹一条更细的浅色层理
      float paleSeam = smoothstep(0.020, 0.0, abs(dd - 1.50));
      col = mix(col, vec3(0.74, 0.66, 0.52), paleSeam * 0.22);

      // 表土里的根痕
      float roots = smoothstep(0.72, 0.95, noise2(vec2(q.x * 5.0 + q.y * 3.0, vWorldPos.y * 1.5)));
      col = mix(col, vec3(0.46, 0.37, 0.25), roots * (1.0 - smoothstep(0.20, 0.46, dd)) * 0.35);

      // 方块底永远是基岩，深水端土层自然收窄
      float baseRock = smoothstep(-4.0 + 0.42, -4.0 + 0.22, vWorldPos.y);
      col = mix(col, vec3(0.34, 0.33, 0.31), baseRock);

      // 颗粒、砾石、层界暗线
      float grain = hash21(floor(q * 72.0) + floor(vWorldPos.y * 72.0));
      col *= 0.93 + grain * 0.14;
      float pebble = step(0.86, hash21(floor(q * 22.0) + floor(vWorldPos.y * 28.0)));
      col = mix(col, vec3(0.60, 0.57, 0.51), pebble * smoothstep(0.9, 1.2, dd) * (1.0 - smoothstep(1.7, 1.9, dd)) * 0.55);
      float seam = 0.0;
      seam += smoothstep(0.014, 0.0, abs(dd - 0.46));
      seam += smoothstep(0.014, 0.0, abs(dd - 1.02));
      seam += smoothstep(0.014, 0.0, abs(dd - 1.78));
      col *= 1.0 - seam * 0.18;
      float bedding = smoothstep(0.72, 1.0, sin((vWorldPos.y + warp * 0.4) * 14.0) * 0.5 + 0.5);
      col *= 1.0 - bedding * 0.20 * smoothstep(1.7, 1.9, dd);
      float rockMottle = fbm(q * 2.2 + vWorldPos.y * 0.5);
      col = mix(col, vec3(0.50, 0.48, 0.44), smoothstep(1.7, 1.9, dd) * rockMottle * 0.25);

      vec3 N = normalize(vNormalW);
      float lam = 0.60 + 0.40 * max(dot(N, uSunDir), 0.0);
      col *= lam;
      col *= mix(1.0, 0.55, uNight);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide,
});
const soilWall = new THREE.Mesh(soilWallGeo, soilWallMat);
soilWall.receiveShadow = true;
scene.add(soilWall);

/* 水柱侧壁：下缘贴地形，颜色按水柱深度走，低透明度透出水下 */
const waterWallUniforms = {
  uTime: { value: 0 },
  uWaterLevel: { value: waterLevel },
  uClarity: { value: params.clarity },
  uNight: { value: 0 },
  uPollution: { value: 0 },
  uShallow: { value: new THREE.Color(0x9beadd) },
  uMid: { value: new THREE.Color(0x39c9bd) },
  uDeep: { value: new THREE.Color(0x178f99) },
  uSky: { value: new THREE.Color(0xfff6e6) },
};
const waterWallGeo = buildCurtain(
  0.022,
  10,
  () => 0.10,
  (x, z) => terrainHeight(x, z) - 0.02
);
const waterWallMat = new THREE.ShaderMaterial({
  uniforms: waterWallUniforms,
  transparent: true,
  depthWrite: false,
  side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    attribute float aColumn;
    varying vec3 vWorldPos;
    varying vec3 vNormalW;
    varying float vColumn;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      vNormalW = normalize(mat3(modelMatrix) * normal);
      vColumn = aColumn;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    uniform float uWaterLevel;
    uniform float uClarity;
    uniform float uNight;
    uniform float uPollution;
    uniform vec3 uShallow;
    uniform vec3 uMid;
    uniform vec3 uDeep;
    uniform vec3 uSky;
    varying vec3 vWorldPos;
    varying vec3 vNormalW;
    varying float vColumn;

    void main() {
      if (vWorldPos.y > uWaterLevel) discard;
      float colT = smoothstep(0.15, 2.8, vColumn);
      float depthRatio = clamp((uWaterLevel - vWorldPos.y) / max(vColumn, 0.01), 0.0, 1.0);

      vec3 col = mix(uShallow, uMid, smoothstep(0.0, 0.45, depthRatio));
      col = mix(col, uDeep, smoothstep(0.40, 1.0, depthRatio));
      col = mix(uShallow, col, 0.35 + 0.65 * colT);

      vec3 N = normalize(vNormalW);
      vec3 V = normalize(cameraPosition - vWorldPos);
      float fres = pow(1.0 - abs(dot(N, V)), 3.0);
      col = mix(col, uSky, fres * 0.18);

      float alpha = mix(0.10, 0.30, colT) * mix(0.85, 1.15, depthRatio);
      alpha = mix(alpha, alpha + 0.12, fres);
      alpha *= 1.0 - uClarity * 0.22;

      vec3 murky = mix(vec3(0.28, 0.27, 0.17), vec3(0.10, 0.12, 0.08), uNight);
      col = mix(col, murky, uPollution * 0.60);
      alpha = mix(alpha, min(0.6, alpha + 0.18), uPollution);
      col *= mix(1.0, 0.60, uNight);

      gl_FragColor = vec4(col, alpha);
    }
  `,
});
const waterWall = new THREE.Mesh(waterWallGeo, waterWallMat);
waterWall.renderOrder = 2;
scene.add(waterWall);

/* 海床焦散：复制地形网格，贴着坡面走 */
const causticUniforms = {
  uTime: { value: 0 },
  uNight: { value: 0 },
  uTide: { value: params.tide },
  uPollution: { value: 0 },
  uWaterLevel: { value: waterLevel },

const causticGeo = terrainGeo.clone();
{
  const cp = causticGeo.attributes.position;
  for (let i = 0; i < cp.count; i++) cp.setY(i, cp.getY(i) + 0.020);
}
const causticMesh = new THREE.Mesh(causticGeo, new THREE.ShaderMaterial({
  uniforms: causticUniforms,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    varying vec3 vWorldPos;
    varying float vGroundY;
    void main() {
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorldPos = wp.xyz;
      vGroundY = position.y - 0.020;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    uniform float uNight;
    uniform float uTide;
    uniform float uPollution;
    uniform float uWaterLevel;
    varying vec3 vWorldPos;
    varying float vGroundY;

    float caustic(vec2 p, float t) {
      vec2 q = p;
      q.x += sin(q.y * 1.6 + t * 0.55) * 0.35;
      q.y += cos(q.x * 1.25 - t * 0.45) * 0.35;
      float a = sin(q.x * 2.4 + t * 0.8) + sin(q.y * 2.8 - t * 0.7);
      float b = sin((q.x + q.y) * 2.0 + t * 0.65) + sin((q.x - q.y) * 2.2 - t * 0.55);
      float v = abs(a) + abs(b);
      return pow(max(0.0, 1.0 - v * 0.33), 4.0);
    }

    void main() {
      float depth = uWaterLevel - vGroundY;
      if (depth < 0.01) discard;
      float c = caustic(vWorldPos.xz * 3.0, uTime * 0.30);
      float fade = smoothstep(0.0, 0.18, depth) * (1.0 - smoothstep(2.6, 3.6, depth));
      float s = (0.08 + uTide * 0.06) * fade * (1.0 - uNight * 0.72) * (1.0 - uPollution * 0.8);
      gl_FragColor = vec4(vec3(1.0, 0.96, 0.82) * c * s, 1.0);
    }
  `,
}));
causticMesh.renderOrder = 1;
scene.add(causticMesh);

function randomWaterPoint(minDepth = 0.3, maxDepth = 3.2) {
  for (let i = 0; i < 500; i++) {
    const x = (Math.random() - 0.5) * (BLOCK_SIZE - 1.0);
    const z = (Math.random() - 0.5) * (BLOCK_SIZE - 1.0);
    if (!insideBlock(x, z, 0.55)) continue;
    const g = terrainHeight(x, z);
    const d = waterLevel - g;
    if (d >= minDepth && d <= maxDepth) return { x, z, g, d };
  }
  const g = terrainHeight(0, 0);
  return { x: 0, z: 0, g, d: waterLevel - g };
}

function simIndexFromWorld(x, z) {
  const u = (x + SEA_SIZE / 2) / SEA_SIZE;
  const v = 0.5 - z / SEA_SIZE;
  return { x: u * (SEA_GRID - 1), y: v * (SEA_GRID - 1) };
}

function addDrop(x, z, strength = 0.12, radius = 0.45) {
  const { x: cx, y: cz } = simIndexFromWorld(x, z);
  const cellR = Math.max(1, (radius / SEA_SIZE) * (SEA_GRID - 1));
  const ix = Math.round(cx);
  const iz = Math.round(cz);
  const reach = Math.ceil(cellR);
  for (let dz = -reach; dz <= reach; dz++) {
    for (let dx = -reach; dx <= reach; dx++) {
      const gx = ix + dx;
      const gz = iz + dz;
      if (gx < 1 || gx >= SEA_GRID - 1 || gz < 1 || gz >= SEA_GRID - 1) continue;
      const dist = Math.hypot(dx, dz) / cellR;
      if (dist >= 1) continue;
      const f = Math.cos(dist * Math.PI * 0.5);
      const i = gz * SEA_GRID + gx;
      seaSim.h[i] += strength * f;
      seaSim.v[i] += strength * 0.55 * f;
    }
  }
}

function stepSea() {
  const N = SEA_GRID;
  const h = seaSim.h;
  const v = seaSim.v;
  const hn = seaSim.hNext;
  for (let z = 1; z < N - 1; z++) {
    const row = z * N;
    for (let x = 1; x < N - 1; x++) {
      const i = row + x;
      const avg = (h[i - 1] + h[i + 1] + h[i - N] + h[i + N]) * 0.25;
      v[i] = (v[i] + (avg - h[i]) * 0.32) * 0.995;
      hn[i] = (h[i] + v[i]) * 0.9995;
    }
  }
  for (let x = 0; x < N; x++) {
    hn[x] = 0; hn[(N - 1) * N + x] = 0;
  }
  for (let z = 0; z < N; z++) {
    hn[z * N] = 0; hn[z * N + N - 1] = 0;
  }
  seaSim.h = hn;
  seaSim.hNext = h;
}

function updateSeaSim(dt) {
  seaSim.acc = Math.min(seaSim.acc + dt, 0.06);
  while (seaSim.acc >= 1 / 60) {
    stepSea();
    seaSim.acc -= 1 / 60;
  }
  heightTex.image.data = seaSim.h;
  heightTex.needsUpdate = true;

  seaSim.ambientTimer -= dt;
  if (seaSim.ambientTimer <= 0) {
    seaSim.ambientTimer = 1.6 + Math.random() * 2.4;
    const a = Math.random() * Math.PI * 2;
    const rr = 8 + Math.random() * 7;
    if (rr < SEA_SIZE * 0.46) {
      addDrop(Math.cos(a) * rr, Math.sin(a) * rr, 0.018 + Math.random() * 0.02, 0.6);
    }
  }
}

function sampleSeaHeight(x, z) {
  const { x: gx, y: gz } = simIndexFromWorld(x, z);
  if (gx < 0 || gx >= SEA_GRID - 1 || gz < 0 || gz >= SEA_GRID - 1) {
    return waterLevel + baseWaveJS(x, z, simTime) * params.wave;
  }
  const x0 = Math.floor(gx);
  const z0 = Math.floor(gz);
  const fx = gx - x0;
  const fz = gz - z0;
  const N = SEA_GRID;
  const i00 = z0 * N + x0;
  const i10 = i00 + 1;
  const i01 = i00 + N;
  const i11 = i01 + 1;
  const h00 = seaSim.h[i00];
  const h10 = seaSim.h[i10];
  const h01 = seaSim.h[i01];
  const h11 = seaSim.h[i11];
  const sim = h00 * (1 - fx) * (1 - fz) + h10 * fx * (1 - fz)
    + h01 * (1 - fx) * fz + h11 * fx * fz;
  return waterLevel + sim * SEA_HEIGHT_SCALE + baseWaveJS(x, z, simTime) * params.wave;
}

  trunk.castShadow = true;
  g.add(trunk);

    nut.position.set(top.x + (Math.random() - 0.5) * 0.12, top.y - 0.04, top.z + (Math.random() - 0.5) * 0.12);
    coconuts.add(nut);

  g.add(coconuts);
  const pivots = [];
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2 + Math.random() * 0.15;
    const pivot = new THREE.Group();

    pivot.add(leaf);
    g.add(pivot);
    pivots.push(pivot);
  }
  g.scale.setScalar(scale);
  islandGroup.add(g);
  palms.push({ group: g, pivots, phase: Math.random() * Math.PI * 2 });
}

/* 山体盖子：中央山丘从岛面切下来，之后跟着蟹背升起                      */
/* ------------------------------------------------------------------ */
const mountainGroup = new THREE.Group();
mountainGroup.name = 'mountainGroup';
mountainGroup.position.set(MOUNTAIN_C.x, 0, MOUNTAIN_C.z);
islandGroup.add(mountainGroup);

// 把山体范围内的静态道具（灯塔、棕榈、花草、岩石、小路…）整体挂到盖子上
for (const child of [...islandGroup.children]) {
  if (child === mountainGroup || child === pier) continue;
  if (child.userData.creatureId) continue;
  const dx = child.position.x - MOUNTAIN_C.x;
  const dz = child.position.z - MOUNTAIN_C.z;
  if (Math.hypot(dx, dz) < MOUNTAIN_R * 1.04) {
    mountainGroup.attach(child);

}

// 盖子顶面：和岛面同一套高度/颜色，边缘用不规则半径切出来
let capSideMesh = null;
let capUnderMesh = null;
{
  const CAP_RINGS = 40;
  const CAP_OVERHANG = 0.08;
  const CAP_SEGS = 180;
  const pos = [];
  const col = [];
  const idx = [];
  const tmpCol = new THREE.Color();
  for (let i = 0; i <= CAP_RINGS; i++) {
    const t = i / CAP_RINGS;
    for (let j = 0; j <= CAP_SEGS; j++) {
      const a = (j / CAP_SEGS) * Math.PI * 2;
      const rim = mountainRadiusAt(a) + CAP_OVERHANG;
      const r = t * rim;
      const lx = Math.cos(a) * r;
      const lz = Math.sin(a) * r;
      const wx = ISLAND_C.x + MOUNTAIN_C.x + lx;
      const wz = ISLAND_C.z + MOUNTAIN_C.z + lz;
      const wy = islandSurfaceHeight(wx, wz);
      pos.push(lx, wy + 0.012, lz);
      surfaceColorAt(wx, wz, wy, surfaceSlope(wx, wz), tmpCol);
      col.push(tmpCol.r, tmpCol.g, tmpCol.b);
    }
  }
  for (let i = 0; i < CAP_RINGS; i++) {
    for (let j = 0; j < CAP_SEGS; j++) {
      const a = i * (CAP_SEGS + 1) + j;
      const b = a + 1;
      const c = a + (CAP_SEGS + 1);
      const d = c + 1;
      idx.push(a, b, c, b, d, c);
    }
  }
  const capTopGeo = new THREE.BufferGeometry();
  capTopGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  capTopGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  capTopGeo.setIndex(idx);
  capTopGeo.computeVertexNormals();
  const capTop = new THREE.Mesh(capTopGeo, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.96, metalness: 0,
  }));
  capTop.castShadow = false;
  capTop.receiveShadow = false;
  mountainGroup.add(capTop);

  // 侧面切面 + 底面：抬起来后能看到岩石/土壤断面
  const topCenter = islandSurfaceHeight(
    ISLAND_C.x + MOUNTAIN_C.x,
    ISLAND_C.z + MOUNTAIN_C.z
  );
  const bottomCenter = topCenter - 1.05;
  const SIDE_ROWS = 6;
  const sidePos = [];
  const sideCol = [];
  const sideIdx = [];
  const topC = new THREE.Color();
  for (let j = 0; j <= CAP_SEGS; j++) {
    const a = (j / CAP_SEGS) * Math.PI * 2;
    const rim = mountainRadiusAt(a) + CAP_OVERHANG;
    const lx = Math.cos(a) * rim;
    const lz = Math.sin(a) * rim;
    const wx = ISLAND_C.x + MOUNTAIN_C.x + lx;
    const wz = ISLAND_C.z + MOUNTAIN_C.z + lz;
    const topY = islandSurfaceHeight(wx, wz) + 0.012;
    surfaceColorAt(wx, wz, topY, 0.3, topC);
    for (let i = 0; i <= SIDE_ROWS; i++) {
      const t = i / SIDE_ROWS;
      const y = topY + (bottomCenter - topY) * t;
      sidePos.push(lx, y, lz);
      const n = 0.5 + 0.5 * Math.sin(wx * 3.1 + wz * 2.3 + y * 2.7);
      const soil = 0.20 + n * 0.10;
      const r = topC.r * (1 - t) + soil * t;
      const g = topC.g * (1 - t) + (soil * 0.84) * t;
      const b = topC.b * (1 - t) + (soil * 0.70) * t;
      sideCol.push(r, g, b);
    }
  }
  for (let j = 0; j < CAP_SEGS; j++) {
    for (let i = 0; i < SIDE_ROWS; i++) {
      const a = j * (SIDE_ROWS + 1) + i;
      const b = a + 1;
      const c = (j + 1) * (SIDE_ROWS + 1) + i;
      const d = c + 1;
      sideIdx.push(a, c, b, b, c, d);
    }
  }
  const capSideGeo = new THREE.BufferGeometry();
  capSideGeo.setAttribute('position', new THREE.Float32BufferAttribute(sidePos, 3));
  capSideGeo.setAttribute('color', new THREE.Float32BufferAttribute(sideCol, 3));
  capSideGeo.setIndex(sideIdx);
  capSideGeo.computeVertexNormals();
  const capSide = new THREE.Mesh(capSideGeo, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 1, metalness: 0, flatShading: true,
    side: THREE.DoubleSide,
  }));
  capSide.castShadow = true;
  capSide.visible = false;
  capSideMesh = capSide;
  mountainGroup.add(capSide);

  // 盖子底面：粗糙的岩土，抬头能看到
  const underPos = [0, bottomCenter - 0.35, 0];
  const underCol = [0.18, 0.155, 0.13];
  const underIdx = [];
  for (let j = 0; j <= CAP_SEGS; j++) {
    const a = (j / CAP_SEGS) * Math.PI * 2;
    const rim = mountainRadiusAt(a) + CAP_OVERHANG;
    const lx = Math.cos(a) * rim;
    const lz = Math.sin(a) * rim;
    underPos.push(lx, bottomCenter, lz);
    const n = 0.5 + 0.5 * Math.sin(lx * 4.1 + lz * 3.3);
    underCol.push(0.16 + n * 0.09, 0.14 + n * 0.08, 0.12 + n * 0.07);
  }
  for (let j = 0; j < CAP_SEGS; j++) {
    underIdx.push(0, 1 + j, 2 + j);
  }
  const capUnderGeo = new THREE.BufferGeometry();
  capUnderGeo.setAttribute('position', new THREE.Float32BufferAttribute(underPos, 3));
  capUnderGeo.setAttribute('color', new THREE.Float32BufferAttribute(underCol, 3));
  capUnderGeo.setIndex(underIdx);
  capUnderGeo.computeVertexNormals();
  const capUnder = new THREE.Mesh(capUnderGeo, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 1, metalness: 0, flatShading: true,
    side: THREE.DoubleSide,
  }));
  capUnder.visible = false;
  capUnderMesh = capUnder;
  mountainGroup.add(capUnder);
}

const creatureGroups = [];
const creatures = [];
const clickTargets = [];

function makeCreature(id, group, squishNode, opts = {}) {
  group.userData.creatureId = id;
  const creature = {
    id,
    group,
    squishNode,
    squish: 0,
    squishVel: 0,
    home: group.position.clone(),
    homeRotY: group.rotation.y,
    homeScale: group.scale.clone(),
    update: opts.update || null,
    randomize: opts.randomize || null,
    reset: opts.reset || null,
    glowMats: opts.glowMats || [],
    baseScale: opts.baseScale ?? 1,
    noSquish: opts.noSquish || false,
  };
  creatures.push(creature);
  creatureGroups.push(group);
  clickTargets.push(group);
  (opts.parent || islandGroup).add(group);
  return creature;
}

/* --- 小蟹 --------------------------------------------------------- */
function buildCrab() {
  const g = new THREE.Group();
  const inner = new THREE.Group();
  g.add(inner);
  const mat = jellyMat(0xff7b61, { opacity: 0.9 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2b201c, roughness: 0.45 });

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.30, 32, 20), mat);
  body.scale.set(1.18, 0.56, 0.86);
  body.position.y = 0.185;
  body.castShadow = true;
  inner.add(body);

  for (const sx of [-1, 1]) {
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.024, 0.13, 8), mat);
    stalk.position.set(sx * 0.115, 0.36, 0.14);
    inner.add(stalk);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.042, 12, 8), dark);
    eye.position.set(sx * 0.115, 0.435, 0.15);
    inner.add(eye);
  }

  const claws = [];
  for (const sx of [-1, 1]) {
    const pivot = new THREE.Group();
    pivot.position.set(sx * 0.30, 0.22, 0.16);
    pivot.rotation.z = sx * -0.55;
    pivot.rotation.x = -0.35;
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.05, 0.24, 10), mat);
    arm.position.y = -0.11;
    const claw = new THREE.Mesh(new THREE.SphereGeometry(0.085, 16, 12), mat);
    claw.scale.set(1.0, 1.45, 0.8);
    claw.position.y = -0.27;
    pivot.add(arm, claw);
    inner.add(pivot);
    claws.push({ pivot, sx });
  }

  const legs = [];
  for (const sx of [-1, 1]) {
    for (let i = 0; i < 4; i++) {
      const pivot = new THREE.Group();
      pivot.position.set(sx * 0.24, 0.16, -0.18 + i * 0.12);
      pivot.rotation.z = sx * 1.02;
      const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.011, 0.30, 6), mat);
      leg.position.y = -0.15;
      pivot.add(leg);
      inner.add(pivot);
      legs.push({ pivot, sx, phase: i * 0.9 + (sx > 0 ? Math.PI : 0) });
    }
  }

  g.position.set(4.05, groundAtLocal(4.05, -0.35) + 0.02, -0.35);
  g.scale.setScalar(1.05);
  const path = { cx: 4.05, cz: -0.35, rx: 0.38, rz: 0.82 };

  const update = (t, dt) => {
    const a = t * 0.24;
    const x = path.cx + Math.cos(a) * path.rx;
    const z = path.cz + Math.sin(a) * path.rz;
    const dx = -Math.sin(a) * path.rx;
    const dz = Math.cos(a) * path.rz;
    g.position.x = x;
    g.position.z = z;
    g.position.y = groundAtLocal(x, z) + 0.02;
    g.rotation.y = Math.atan2(-dz, dx) + Math.PI / 2;
    const step = Math.sin(t * 9.0) * 0.16;
    legs.forEach((l) => { l.pivot.rotation.x = Math.sin(t * 9.0 + l.phase) * 0.32; });
    claws.forEach((c, i) => {
      c.pivot.rotation.x = -0.35 + Math.sin(t * 2.1 + i * 1.6) * 0.18;
    });
    body.position.y = 0.185 + Math.abs(step) * 0.05;
  };

  return makeCreature('crab', g, inner, {
    update,
    reset: () => {
      path.cx = 4.05; path.cz = -0.35; path.rx = 0.38; path.rz = 0.82;
    },
    randomize: () => {
      const spots = [[4.05, -0.35], [-4.0, -0.5], [0.6, 4.1], [-1.8, 4.0]];
      const spot = spots[Math.floor(Math.random() * spots.length)];
      path.cx = spot[0];
      path.cz = spot[1];
      path.rx = 0.32 + Math.random() * 0.22;
      path.rz = 0.6 + Math.random() * 0.4;
      g.scale.setScalar(0.9 + Math.random() * 0.2);
    },
  });
}

/* --- 海星 --------------------------------------------------------- */
function buildStarfish() {
  const g = new THREE.Group();
  const inner = new THREE.Group();
  g.add(inner);
  const mat = jellyMat(0xff9a62, { opacity: 0.9 });

  const shape = new THREE.Shape();
  const arms = 5;
  const pts = [];
  for (let i = 0; i < arms * 2; i++) {
    const a = (i / (arms * 2)) * Math.PI * 2 - Math.PI / 2;
    const r = i % 2 === 0 ? 0.34 : 0.135;
    pts.push(new THREE.Vector2(Math.cos(a) * r, Math.sin(a) * r));
  }
  shape.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) shape.lineTo(pts[i].x, pts[i].y);
  shape.closePath();

  const geo = new THREE.ExtrudeGeometry(shape, {
    depth: 0.075, bevelEnabled: true, bevelThickness: 0.035,
    bevelSize: 0.03, bevelSegments: 2, curveSegments: 4,
  });
  geo.rotateX(-Math.PI / 2);
  const star = new THREE.Mesh(geo, mat);
  star.castShadow = true;
  inner.add(star);

  for (let i = 0; i < arms; i++) {
    const a = (i / arms) * Math.PI * 2 - Math.PI / 2;
    const tip = new THREE.Mesh(new THREE.SphereGeometry(0.035, 10, 8), mat);
    tip.position.set(Math.cos(a) * 0.30, 0.10, Math.sin(a) * 0.30);
    tip.scale.y = 0.6;
    inner.add(tip);
  }
  const center = new THREE.Mesh(new THREE.SphereGeometry(0.05, 12, 8), mat);
  center.position.y = 0.10;
  center.scale.y = 0.5;
  inner.add(center);

  const home = { x: 4.35, z: 1.05 };
  g.position.set(home.x, groundAtLocal(home.x, home.z) + 0.02, home.z);
  g.scale.setScalar(1.25);

  const update = (t) => {
    g.rotation.y = Math.sin(t * 0.18) * 0.35;
    inner.rotation.z = Math.sin(t * 0.8) * 0.035;
    star.position.y = Math.abs(Math.sin(t * 1.1)) * 0.004;
  };

  return makeCreature('starfish', g, inner, {
    update,
    randomize: () => {
      const spots = [[4.35, 1.05], [-4.4, -0.9], [0.9, 4.2], [-2.2, 3.9], [4.6, -1.4]];
      const spot = spots[Math.floor(Math.random() * spots.length)];
      g.position.set(spot[0], groundAtLocal(spot[0], spot[1]) + 0.02, spot[1]);
      g.rotation.y = Math.random() * Math.PI * 2;
      g.scale.setScalar(1.1 + Math.random() * 0.3);
    },
  });
}

/* --- 海葵 --------------------------------------------------------- */
function buildAnemone() {
  const g = new THREE.Group();
  const inner = new THREE.Group();
  g.add(inner);
  const baseMat = jellyMat(0xb66bd6, { opacity: 0.9 });
  const tentMat = jellyMat(0xe78fd4, { opacity: 0.85, iridescence: 0.3 });

  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.19, 0.20, 20), baseMat);
  base.position.y = 0.10;
  base.castShadow = true;
  inner.add(base);

  const pivots = [];
  const rings = [
    { count: 12, radius: 0.075, tilt: 0.72, len: 0.30 },
    { count: 9, radius: 0.045, tilt: 0.48, len: 0.36 },
    { count: 6, radius: 0.018, tilt: 0.22, len: 0.41 },
  ];
  rings.forEach((ring, ri) => {
    for (let i = 0; i < ring.count; i++) {
      const a = (i / ring.count) * Math.PI * 2 + ri * 0.35;
      const pivot = new THREE.Group();
      pivot.position.set(Math.cos(a) * ring.radius, 0.20, Math.sin(a) * ring.radius);
      pivot.rotation.y = a;
      pivot.rotation.x = ring.tilt;
      const len = ring.len * (0.85 + Math.random() * 0.25);
      const geo = new THREE.CylinderGeometry(0.008, 0.015, len, 6, 1);
      geo.translate(0, len / 2, 0);
      const tent = new THREE.Mesh(geo, tentMat);
      tent.castShadow = true;
      pivot.add(tent);
      inner.add(pivot);
      pivots.push({ pivot, a, phase: Math.random() * Math.PI * 2, baseTilt: ring.tilt });
    }
  });

  const rockTop = groundAtLocal(-3.35, 1.1) + 0.80;
  g.position.set(-3.35, rockTop, 1.1);
  g.scale.setScalar(1.05);

  const update = (t, dt, ctx) => {
    const sway = 0.18 + ctx.wave * 0.32;
    pivots.forEach((p) => {
      p.pivot.rotation.x = p.baseTilt + Math.sin(t * 1.4 + p.phase) * sway * 0.22;
      p.pivot.rotation.z = Math.cos(t * 1.1 + p.phase) * sway * 0.12;
    });
    inner.rotation.y = Math.sin(t * 0.4) * 0.1;
  };

  return makeCreature('anemone', g, inner, {
    update,
    glowMats: [baseMat, tentMat],
    randomize: () => {
      g.position.set(
        -3.35 + (Math.random() - 0.5) * 0.12,
        rockTop,
        1.1 + (Math.random() - 0.5) * 0.12
      );
    },
  });
}

  inner.add(body);

  for (const sx of [-1, 1]) {
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.010, 0.012, 0.10, 6), bodyMat);
    stalk.position.set(sx * 0.055, 0.155, 0.10);
    stalk.rotation.x = -0.35;
    inner.add(stalk);
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), dark);
    eye.position.set(sx * 0.055, 0.205, 0.125);
    inner.add(eye);
  }

  const spiralPts = [];
  for (let i = 0; i <= 90; i++) {
    const a = (i / 90) * Math.PI * 3.4;
    const r = 0.018 * Math.exp(0.235 * a);
    spiralPts.push(new THREE.Vector3(Math.cos(a) * r, Math.sin(a) * r, 0));
  }
  const spiral = new THREE.CatmullRomCurve3(spiralPts);
  const shell = new THREE.Mesh(new THREE.TubeGeometry(spiral, 90, 0.024, 8, false), shellMat);
  shell.position.set(0, 0.235, -0.01);
  shell.rotation.y = -0.25;
  shell.castShadow = true;
  inner.add(shell);

  const shellCore = new THREE.Mesh(new THREE.SphereGeometry(0.07, 14, 10), shellMat);
  shellCore.position.set(0.03, 0.30, -0.015);
  shellCore.scale.z = 0.45;
  inner.add(shellCore);

  g.position.set(-3.4, groundAtLocal(-3.4, 2.5) + 0.015, 2.5);
  g.rotation.y = 0.4;
  g.scale.setScalar(1.22);
  const path = { cx: -3.4, cz: 2.5, r: 0.34 };

  const update = (t) => {
    const a = t * 0.05;
    const x = path.cx + Math.cos(a) * path.r;
    const z = path.cz + Math.sin(a) * path.r * 0.92;
    g.position.set(x, groundAtLocal(x, z) + 0.015, z);
    g.rotation.y = -a + Math.PI / 2;
    inner.rotation.z = Math.sin(t * 1.2) * 0.03;
    const stretch = 1 + Math.sin(t * 2.2) * 0.02;
    body.scale.set(1.9 * stretch, 0.55, 0.8 / stretch);
  };

  return makeCreature('snail', g, inner, {
    update,
    reset: () => {
      path.cx = -3.4; path.cz = 2.5; path.r = 0.34;
    },
    randomize: () => {
      const spots = [[-3.4, 2.5], [4.3, 0.6], [0.8, 4.1], [-4.0, -1.7]];
      const spot = spots[Math.floor(Math.random() * spots.length)];
      path.cx = spot[0];
      path.cz = spot[1];
      path.r = 0.18 + Math.random() * 0.18;
      g.rotation.y = Math.random() * Math.PI * 2;
    },
  });
}

/* --- 虾 ----------------------------------------------------------- */
function buildShrimp() {
  const g = new THREE.Group();
  const inner = new THREE.Group();
  g.add(inner);
  const mat = jellyMat(0xff9f8c, { opacity: 0.82, iridescence: 0.3 });
  const dark = new THREE.MeshStandardMaterial({ color: 0x2b201c, roughness: 0.45 });

  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(-0.20, 0.02, 0),
    new THREE.Vector3(-0.10, 0.10, 0.01),
    new THREE.Vector3(0.04, 0.13, 0.02),
    new THREE.Vector3(0.18, 0.10, 0.02),
    new THREE.Vector3(0.28, 0.04, 0.01),
  ]);
  const body = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, 0.052, 10, false), mat);
  body.castShadow = true;
  inner.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.065, 14, 10), mat);
  head.position.set(-0.22, 0.02, 0);
  inner.add(head);
  for (const sz of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 6), dark);
    eye.position.set(-0.255, 0.045, sz * 0.035);
    inner.add(eye);
  }

  const tail = new THREE.Group();
  tail.position.set(0.29, 0.035, 0);
  for (let i = 0; i < 3; i++) {
    const fan = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.14, 7), mat);
    fan.rotation.z = Math.PI / 2;
    fan.rotation.y = (i - 1) * 0.4;
    fan.position.set(0.05, 0, (i - 1) * 0.03);
    tail.add(fan);
  }
  inner.add(tail);

  const antennae = [];
  for (const sz of [-1, 1]) {
    const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.002, 0.34, 4), mat);
    antenna.position.set(-0.42, 0.025, sz * 0.02);
    antenna.rotation.z = Math.PI / 2;
    antenna.rotation.y = sz * 0.22;
    inner.add(antenna);
    antennae.push(antenna);
  }

  const poolY = FISH_POOL.surfaceY - 0.07;
  g.position.set(FISH_POOL.x - 0.28, poolY, FISH_POOL.z + 0.16);
  g.scale.setScalar(1.05);

  let target = new THREE.Vector3(FISH_POOL.x + 0.28, poolY, FISH_POOL.z - 0.18);
  let pauseUntil = 0;
  const update = (t, dt) => {
    if (t > pauseUntil && g.position.distanceTo(target) < 0.06) {
      target.set(
        FISH_POOL.x + (Math.random() - 0.5) * 1.1,
        poolY + (Math.random() - 0.5) * 0.03,
        FISH_POOL.z + (Math.random() - 0.5) * 1.1
      );
      pauseUntil = t + 1.0 + Math.random() * 2.2;
    }
    const dir = target.clone().sub(g.position);
    const dist = dir.length();
    if (dist > 0.01) {
      dir.normalize();
      const speed = 0.45;
      g.position.addScaledVector(dir, Math.min(dist, speed * dt));
      g.rotation.y = Math.atan2(-dir.z, dir.x);
    }
    tail.rotation.y = Math.sin(t * 10.0) * 0.35;
    antennae.forEach((a, i) => {
      a.rotation.z = Math.PI / 2 + Math.sin(t * 2.4 + i * 1.7) * 0.15;
    });
    inner.rotation.x = Math.sin(t * 3.0) * 0.06;
  };

  return makeCreature('shrimp', g, inner, {
    update,
    reset: () => {
      target.set(FISH_POOL.x + 0.28, poolY, FISH_POOL.z - 0.18);
      pauseUntil = 0;
    },
    randomize: () => {
      g.position.set(
        FISH_POOL.x + (Math.random() - 0.5) * 1.0,
        poolY,
        FISH_POOL.z + (Math.random() - 0.5) * 1.0
      );
      target.copy(g.position);
      pauseUntil = 0;
    },
  });
}

/* --- 小鱼群 ------------------------------------------------------- */
function buildFishSchool() {
  const g = new THREE.Group();
  const inner = new THREE.Group();
  g.add(inner);
  const mats = [
    jellyMat(0xff9a6a, { opacity: 0.92 }),
    jellyMat(0x7fe3ff, { opacity: 0.92 }),
    jellyMat(0xffd166, { opacity: 0.92 }),
  ];
  const fishes = [];
  const count = 6;
  for (let i = 0; i < count; i++) {
    const f = new THREE.Group();
    const mat = mats[i % mats.length];
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.115, 18, 12), mat);
    body.scale.set(1.6, 0.68, 0.52);
    body.castShadow = true;
    f.add(body);
    const tail = new THREE.Group();
    tail.position.x = -0.17;
    const fin = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.12, 6), mat);
    fin.rotation.z = Math.PI / 2;
    fin.position.x = -0.05;
    tail.add(fin);
    f.add(tail);
    const dorsal = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.09, 5), mat);
    dorsal.position.set(0.0, 0.075, 0);
    dorsal.scale.z = 0.4;
    f.add(dorsal);
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.016, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0x201a17, roughness: 0.4 })
    );
    eye.position.set(0.10, 0.025, 0.045);
    f.add(eye);
    inner.add(f);
    fishes.push({ group: f, tail, mat, phase: (i / count) * Math.PI * 2, radius: 1.05 + (i % 3) * 0.22 });
  }

  g.position.set(FISH_POOL.x, 0, FISH_POOL.z);
  const school = { phase: 0, scale: 1 };

  const update = (t) => {
    fishes.forEach((f, i) => {
      const a = t * 0.55 + school.phase + f.phase;
      const rx = (0.58 + (i % 3) * 0.07) * school.scale;
      const rz = (0.42 + (i % 3) * 0.05) * school.scale;
      const x = Math.cos(a) * rx;
      const z = Math.sin(a) * rz;
      const dx = -Math.sin(a) * rx;
      const dz = Math.cos(a) * rz;
      const y = FISH_POOL.surfaceY - 0.055 + Math.sin(t * 1.7 + f.phase) * 0.010;
      f.group.position.set(x, y, z);
      f.group.rotation.y = Math.atan2(-dz, dx);
      f.group.rotation.z = Math.sin(t * 1.3 + f.phase) * 0.08;
      f.tail.rotation.y = Math.sin(t * 9.0 + f.phase) * 0.5;
      f.group.scale.setScalar(0.78 + (i % 3) * 0.06);
    });
  };

  return makeCreature('fish', g, inner, {
    update,
    reset: () => {
      school.phase = 0;
      school.scale = 1;
    },
    glowMats: mats,
    randomize: () => {
      school.phase = Math.random() * Math.PI * 2;
      school.scale = 0.8 + Math.random() * 0.3;
    },
  });
}

/* --- 岛蟹：整座岛其实是一只趴着的巨蟹 ----------------------------- */
function buildLegacyGiantCrab() {
  const g = new THREE.Group();
  const inner = new THREE.Group();
  g.add(inner);

  const shellMat = jellyMat(0xc94831, { opacity: 0.95, iridescence: 0.14 });
  const darkMat = jellyMat(0x872d20, { opacity: 0.96 });
  const eyeWhiteMat = new THREE.MeshPhysicalMaterial({
    color: 0xfff0d6, roughness: 0.14, clearcoat: 1, transparent: true, opacity: 0,
  });
  const pupilMat = new THREE.MeshStandardMaterial({
    color: 0x171110, roughness: 0.4, transparent: true, opacity: 0,
  });
  const shineMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0,
  });
  const rimMat = jellyMat(0x9c2f22, { opacity: 0.7, iridescence: 0.06 });
  rimMat.opacity = 0;
  const giantMats = [
    { m: shellMat, base: 0.95 },
    { m: darkMat, base: 0.96 },
    { m: eyeWhiteMat, base: 0.98 },
    { m: pupilMat, base: 1.0 },
    { m: shineMat, base: 0.95 },
    { m: rimMat, base: 0.7 },
  ];
  for (const { m } of giantMats) m.opacity = 0;

  // 岛块底下的蟹身
  const body = new THREE.Mesh(new THREE.SphereGeometry(1, 36, 22), darkMat);
  body.scale.set(5.35, 0.62, 4.05);
  body.position.y = -2.8;
  body.castShadow = true;
  body.raycast = () => {};
  inner.add(body);

  // 水线处露出的暗红背甲缘：岛蟹醒来时沿岛岸出现
  {
    const SEGS = 220;
    const pos = [];
    const idx = [];
    for (let i = 0; i <= SEGS; i++) {
      const a = (i / SEGS) * Math.PI * 2;
      const R = shoreRadius(a);
      const innerR = R - 0.22;
      const outerR = R + 0.42;
      const y = 0.035 + 0.02 * Math.sin(a * 5 + 0.5);
      pos.push(Math.cos(a) * innerR, y, Math.sin(a) * innerR);
      pos.push(Math.cos(a) * outerR, y, Math.sin(a) * outerR);
    }
    for (let i = 0; i < SEGS; i++) {
      const a = i * 2;
      const b = a + 1;
      const c = a + 2;
      const d = a + 3;
      idx.push(a, c, b, b, c, d);
    }
    const rimGeo = new THREE.BufferGeometry();
    rimGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    rimGeo.setIndex(idx);
    rimGeo.computeVertexNormals();
    const shellRim = new THREE.Mesh(rimGeo, rimMat);
    shellRim.renderOrder = 1;
    shellRim.raycast = () => {};
    inner.add(shellRim);
  }

  const claws = [];
  const clawSpecs = [
    { x: -4.8, z: 0.8, side: -1 },
    { x: 2.4, z: 4.0, side: 1 },
  ];
  for (const spec of clawSpecs) {
    const side = spec.side;
    const root = new THREE.Group();
    // 从岛前侧的海水里升起，避开方块边
    root.position.set(spec.x, -4.9, spec.z);
    root.rotation.z = side * -1.0;
    root.scale.setScalar(1.55);
    root.visible = false;

    const seg1 = new THREE.Mesh(new THREE.CapsuleGeometry(0.38, 0.66, 6, 14), shellMat);
    seg1.position.y = 0.70;
    seg1.castShadow = true;
    root.add(seg1);

    const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.44, 16, 12), darkMat);
    elbow.position.y = 1.40;
    elbow.castShadow = true;
    root.add(elbow);

    const fore = new THREE.Group();
    fore.position.y = 1.36;
    fore.rotation.z = side * 0.34;
    fore.rotation.x = 0.15;
    const seg2 = new THREE.Mesh(new THREE.CapsuleGeometry(0.30, 0.52, 6, 12), shellMat);
    seg2.position.y = 0.55;
    seg2.castShadow = true;
    fore.add(seg2);

    const pincer = new THREE.Group();
    pincer.position.y = 1.08;
    pincer.rotation.x = 0.05;
    pincer.scale.setScalar(1.12);
    fore.add(pincer);

    const palm = new THREE.Mesh(new THREE.SphereGeometry(0.46, 18, 14), darkMat);
    palm.scale.set(1.08, 0.88, 0.82);
    palm.castShadow = true;
    pincer.add(palm);

    // 尖而短的两指，读起来像蟹钳而不是兔耳
    const fixedFinger = new THREE.Mesh(new THREE.ConeGeometry(0.19, 0.72, 8), shellMat);
    fixedFinger.position.set(-0.24, 0.48, 0.02);
    fixedFinger.rotation.z = 0.30;
    fixedFinger.castShadow = true;
    pincer.add(fixedFinger);

    const movingPivot = new THREE.Group();
    movingPivot.position.set(0.20, 0.16, 0.01);
    movingPivot.rotation.z = -0.24;
    const movingFinger = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.66, 8), shellMat);
    movingFinger.position.set(0.04, 0.42, 0);
    movingFinger.rotation.z = -0.05;
    movingFinger.castShadow = true;
    movingPivot.add(movingFinger);
    pincer.add(movingPivot);

    // 朝内的两排小齿
    for (let i = 0; i < 3; i++) {
      const toothA = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.14, 6), darkMat);
      toothA.position.set(-0.08, 0.42 + i * 0.18, 0.02);
      toothA.rotation.z = Math.PI / 2;
      pincer.add(toothA);
      const toothB = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.13, 6), darkMat);
      toothB.position.set(0.08, 0.44 + i * 0.17, 0.01);
      toothB.rotation.z = -Math.PI / 2;
      pincer.add(toothB);
    }

    // 手臂上的小刺
    for (let i = 0; i < 3; i++) {
      const spike = new THREE.Mesh(new THREE.ConeGeometry(0.065, 0.18, 5), darkMat);
      spike.position.set(side * 0.32, 0.45 + i * 0.30, 0.02);
      spike.rotation.z = side * -1.1;
      root.add(spike);
    }

    root.add(fore);
    inner.add(root);
    claws.push({ root, fore, pincer, movingPivot, side, baseX: spec.x, baseZ: spec.z });
  }

  const eyes = [];
  for (const side of [-1, 1]) {
    const eyeX = side * 1.1;
    const eyeZ = 2.7;
    const eyeBase = groundAtLocal(eyeX, eyeZ);
    const eyeRoot = new THREE.Group();
    eyeRoot.position.set(eyeX, eyeBase - 1.6, eyeZ);
    eyeRoot.userData.baseY = eyeBase;
    eyeRoot.rotation.x = 0.28;
    eyeRoot.scale.setScalar(1.15);
    eyeRoot.visible = false;

    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.085, 0.72, 8), shellMat);
    stalk.position.y = 0.36;
    stalk.castShadow = true;
    eyeRoot.add(stalk);

    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.25, 20, 14), eyeWhiteMat);
    ball.position.y = 0.86;
    ball.castShadow = true;
    eyeRoot.add(ball);

    const pupil = new THREE.Mesh(new THREE.SphereGeometry(0.145, 16, 12), pupilMat);
    pupil.position.set(0, 0.89, 0.18);
    eyeRoot.add(pupil);

    const shine = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), shineMat);
    shine.position.set(-0.065, 0.97, 0.27);
    eyeRoot.add(shine);

    inner.add(eyeRoot);
    eyes.push(eyeRoot);
  }

  const glow = new THREE.PointLight(0xff5a33, 0, 9, 2);
  glow.position.set(0, -1.6, 0);
  inner.add(glow);

  const update = (t) => {
    const p = crabState.progress;
    const e = p * p * (3 - 2 * p);
    const wob = Math.sin(t * 1.6) * 0.03 * e;

    for (const c of claws) {
      c.root.visible = p > 0.002;
      c.root.position.x = c.baseX;
      c.root.position.z = c.baseZ;
      c.root.position.y = THREE.MathUtils.lerp(-4.9, -1.85, e) + Math.sin(t * 2.1 + c.side) * 0.03 * e;
      c.root.rotation.z = c.side * THREE.MathUtils.lerp(-1.0, -0.45, e) + c.side * wob;
      c.root.rotation.x = Math.cos(t * 1.2 + c.side) * 0.05 * e;
      c.movingPivot.rotation.z = -0.24 - e * (0.11 + Math.sin(t * 2.4 + c.side) * 0.05);
    }
    for (const eye of eyes) {
      eye.visible = p > 0.002;
      const baseY = eye.userData.baseY;
      eye.position.y = THREE.MathUtils.lerp(baseY - 1.6, baseY + 0.25, e)
        + Math.sin(t * 1.7 + eye.position.x) * 0.02 * e;
      eye.rotation.z = Math.sin(t * 1.1 + eye.position.x) * 0.05 * e;
    }
    for (const { m, base } of giantMats) m.opacity = e * base;
    glow.intensity = e * 1.9;
  };

  const creature = makeCreature('islandCrab', g, inner, {
    update,
    randomize: () => {},
    glowMats: [],
    noSquish: true,
  });
  return creature;
}
